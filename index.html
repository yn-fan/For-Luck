          );
          addBurst(timing, "放生 +1", item.name, geometry, "release");
          renderUi();
          saveState();
          playWaterSound();
          announce(
            feverTriggered
              ? "连续二十次 PERFECT，放生时刻开始，持续八秒"
              : STRINGS.releaseStatus(timing.label, item.name, formatter.format(releaseTotal), comboCount)
          );
          if (!fromAuto && navigator.vibrate) {
            navigator.vibrate(timing.rank === "perfect" ? [8, 14, 14] : 6);
          }
        }

        function performCurrentAction(fromAuto = false) {
          if (fortuneOpen || fortunePending) return;
          if (fromAuto) {
            rhythmBeatIndex = (rhythmBeatIndex + 1) % 4;
            rhythmEpoch = performance.now();
          }
          if (mode === "merit") strikeMerit(fromAuto);
          else releaseFish(fromAuto);
        }

        function stopAuto(shouldAnnounce = false) {
          window.clearTimeout(autoTimer);
          autoTimer = 0;
          if (!autoActive) return;
          autoActive = false;
          if (sessionActionCount > 0) sessionMissAnchor = performance.now();
          renderUi();
          resetIdleHint();
          if (shouldAnnounce) announce("自动操作已关闭");
        }

        function scheduleAuto() {
          window.clearTimeout(autoTimer);
          if (!autoActive) return;
          autoTimer = window.setTimeout(() => {
            performCurrentAction(true);
            scheduleAuto();
          }, MODES[mode].autoDelay);
        }

        function toggleAuto() {
          if (fortuneOpen || fortunePending) return;
          if (autoActive) {
            stopAuto(true);
            return;
          }
          autoActive = true;
          renderUi();
          window.clearTimeout(autoTimer);
          resetIdleHint();
          rhythmEpoch = performance.now();
          performCurrentAction(true);
          scheduleAuto();
          announce(`${MODES[mode].autoLabel}已开启`);
        }

        function toggleSound() {
          if (fortuneOpen || fortunePending) return;
          resetIdleHint();
          soundEnabled = !soundEnabled;
          renderUi();
          saveState();
          setSystemMessage("");
          announce(soundEnabled ? "声音已开启" : "声音已关闭");
          if (soundEnabled) ensureAudio();
        }

        function setMode(nextMode, focusTab = false) {
          if (fortuneOpen || fortunePending) return;
          if (nextMode === mode) {
            if (focusTab) (mode === "merit" ? meritTab : releaseTab).focus();
            return;
          }
          const hadAuto = autoActive;
          stopAuto(false);
          resetSessionCycle();
          mode = nextMode;
          comboCount = 0;
          perfectStreak = 0;
          feverStarted = 0;
          feverUntil = 0;
          feverWasActive = false;
          document.body.removeAttribute("data-fever");
          lastTimingGrade = "READY";
          rhythmBeatIndex = 0;
          rhythmEpoch = performance.now();
          resetIdleHint();
          renderUi();
          if (focusTab) (mode === "merit" ? meritTab : releaseTab).focus();
          if (hadAuto) announce(STRINGS.autoStoppedOnSwitch);
          else announce(mode === "merit" ? STRINGS.modeMerit : STRINGS.modeRelease);
        }

        function makeTexture() {
          const random = seededRandomFactory(2905);
          backgroundCanvas.width = Math.max(1, Math.round(canvasWidth));
          backgroundCanvas.height = Math.max(1, Math.round(canvasHeight));
          backgroundContext.clearRect(0, 0, canvasWidth, canvasHeight);
          backgroundContext.fillStyle = colors.washi;
          backgroundContext.fillRect(0, 0, canvasWidth, canvasHeight);

          const minSide = Math.min(canvasWidth, canvasHeight);
          const drawHalftoneField = (centerX, centerY, radius, spacing, color, alpha, hollow = false) => {
            backgroundContext.save();
            backgroundContext.beginPath();
            backgroundContext.arc(centerX, centerY, radius, 0, Math.PI * 2);
            backgroundContext.clip();
            backgroundContext.fillStyle = color;
            backgroundContext.globalAlpha = alpha;
            const startX = Math.floor((centerX - radius) / spacing) * spacing;
            const startY = Math.floor((centerY - radius) / spacing) * spacing;
            for (let dotY = startY; dotY <= centerY + radius; dotY += spacing) {
              for (let dotX = startX; dotX <= centerX + radius; dotX += spacing) {
                const distance = Math.hypot(dotX - centerX, dotY - centerY);
                if (distance > radius) continue;
                const normalized = Math.min(1, distance / radius);
                const weight = hollow ? normalized : 1 - normalized;
                const dotRadius = spacing * (0.055 + weight * 0.21);
                backgroundContext.beginPath();
                backgroundContext.arc(dotX, dotY, dotRadius, 0, Math.PI * 2);
                backgroundContext.fill();
              }
            }
            backgroundContext.restore();
          };

          drawHalftoneField(
            -canvasWidth * 0.02,
            canvasHeight * 0.27,
            minSide * 0.3,
            Math.max(10, minSide * 0.019),
            colors.ink,
            0.18
          );
          drawHalftoneField(
            canvasWidth * 1.01,
            canvasHeight * 0.18,
            minSide * 0.24,
            Math.max(11, minSide * 0.021),
            colors.rust,
            0.2
          );
          drawHalftoneField(
            canvasWidth * 0.5,
            canvasHeight * 0.55,
            minSide * 0.52,
            Math.max(14, minSide * 0.027),
            colors.lakeDeep,
            0.08,
            true
          );

          backgroundContext.save();
          backgroundContext.globalAlpha = 0.08;
          backgroundContext.strokeStyle = colors.ink;
          backgroundContext.lineWidth = Math.max(1, minSide * 0.002);
          const hatchGap = Math.max(14, minSide * 0.024);
          for (let line = -canvasHeight; line < canvasWidth; line += hatchGap) {
            backgroundContext.beginPath();
            backgroundContext.moveTo(line, canvasHeight);
            backgroundContext.lineTo(line + canvasHeight * 0.36, canvasHeight * 0.64);
            backgroundContext.stroke();
          }
          backgroundContext.restore();

          const grainCount = Math.min(180, Math.max(80, Math.round(canvasWidth * canvasHeight / 9000)));
          backgroundContext.fillStyle = colors.ink;
          for (let grain = 0; grain < grainCount; grain += 1) {
            backgroundContext.globalAlpha = 0.035 + random() * 0.07;
            const grainSize = 0.4 + random() * 1.3;
            backgroundContext.fillRect(
              random() * canvasWidth,
              random() * canvasHeight,
              grainSize,
              grainSize * (0.5 + random())
            );
          }
          backgroundContext.globalAlpha = 1;
        }

        function resizeCanvas() {
          if (!(window.innerWidth > 0 && window.innerHeight > 0)) return;
          pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
          canvasWidth = window.innerWidth;
          canvasHeight = window.innerHeight;
          canvas.width = Math.max(1, Math.round(canvasWidth * pixelRatio));
          canvas.height = Math.max(1, Math.round(canvasHeight * pixelRatio));
          context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
          makeTexture();
        }

        function drawPaperTexture() {
          context.drawImage(backgroundCanvas, 0, 0, canvasWidth, canvasHeight);
        }

        function drawEnso(x, y, size, time) {
          const phase = reducedMotion ? 0.38 : getRhythmPhase(time);
          const approach = phase * phase * (3 - 2 * phase);
          const targetRadius = size * 0.43;
          const farthestX = Math.max(x, canvasWidth - x);
          const farthestY = Math.max(y, canvasHeight - y);
          const outerRadius = Math.hypot(farthestX, farthestY) * 1.08;
          const ringRadius = outerRadius + (targetRadius - outerRadius) * approach;
          const period = MODES.merit.autoDelay;
          const beatNumber = ((rhythmBeatIndex + Math.floor((time - rhythmEpoch) / period)) % 4 + 4) % 4;
          const beatColors = [colors.rust, colors.lakeDeep, colors.washiDeep, colors.purple];
          const beatColor = beatColors[beatNumber];
          context.save();

          context.translate(x - size * 0.03, y + size * 0.01);
          context.rotate(-0.13);
          context.fillStyle = colors.pink;
          context.globalAlpha = 0.78;
          context.beginPath();
          context.moveTo(-size * 0.43, -size * 0.2);
          context.lineTo(size * 0.33, -size * 0.42);
          context.lineTo(size * 0.46, size * 0.15);
          context.lineTo(-size * 0.28, size * 0.41);
          context.closePath();
          context.fill();
          context.strokeStyle = colors.ink;
          context.globalAlpha = 1;
          context.lineWidth = Math.max(4, size * 0.014);
          context.stroke();
          context.restore();

          context.save();
          context.translate(x, y);
          context.fillStyle = colors.washiLight;
          context.globalAlpha = 0.9;
          context.beginPath();
          context.ellipse(0, 0, size * 0.405, size * 0.315, 0, 0, Math.PI * 2);
          context.fill();
          context.strokeStyle = colors.ink;
          context.lineWidth = Math.max(4, size * 0.017);
          context.stroke();
          context.restore();

          context.save();
          context.translate(x, y);
          for (let track = 0; track < 3; track += 1) {
            const separation = (track - 1) * Math.max(12, size * 0.045) * (1 - approach);
            context.strokeStyle = track === 1 ? beatColor : colors.ink;
            context.globalAlpha = track === 1 ? 0.82 : 0.28;
            context.lineWidth = track === 1
              ? Math.max(5, size * (0.012 + phase * 0.009))
              : Math.max(2, size * 0.006);
            context.setLineDash(track === 1 ? [] : [Math.max(18, size * 0.05), Math.max(12, size * 0.03)]);
            context.beginPath();
            context.arc(0, 0, Math.max(targetRadius * 0.9, ringRadius + separation), 0, Math.PI * 2);
            context.stroke();
          }
          context.setLineDash([]);

          const arrowDistance = Math.max(targetRadius * 1.08, ringRadius);
          context.fillStyle = beatColor;
          context.strokeStyle = colors.ink;
          context.lineWidth = Math.max(2, size * 0.007);
          context.globalAlpha = 0.88;
          for (let arrow = 0; arrow < 4; arrow += 1) {
            const angle = arrow * Math.PI * 0.5;
            const arrowX = Math.cos(angle) * arrowDistance;
            const arrowY = Math.sin(angle) * arrowDistance;
            context.save();
            context.translate(arrowX, arrowY);
            context.rotate(angle + Math.PI * 0.5);
            context.beginPath();
            context.moveTo(0, Math.max(14, size * 0.04));
            context.lineTo(-Math.max(10, size * 0.03), -Math.max(12, size * 0.035));
            context.lineTo(Math.max(10, size * 0.03), -Math.max(12, size * 0.035));
            context.closePath();
            context.fill();
            context.stroke();
            context.restore();
          }
          context.restore();

          context.save();
          const numberPositions = [
            { x: canvasWidth * 0.08, y: canvasHeight * 0.46 },
            { x: canvasWidth * 0.34, y: Math.max(72, canvasHeight * 0.12) },
            { x: canvasWidth * 0.92, y: canvasHeight * 0.55 },
            { x: canvasWidth * 0.68, y: canvasHeight * 0.88 }
          ];
          const numberSize = Math.max(58, Math.min(112, Math.min(canvasWidth, canvasHeight) * 0.13));
          context.font = `${cssValue("--fontWeightBold")} ${numberSize}px ${cssValue("--fontFamilyBase")}`;
          context.textAlign = "center";
          context.textBaseline = "middle";
          for (let beat = 0; beat < 4; beat += 1) {
            const active = beat === beatNumber;
            context.globalAlpha = active ? 0.92 : 0.11;
            context.lineWidth = Math.max(4, numberSize * 0.08);
            context.strokeStyle = colors.ink;
            context.strokeText(String(beat + 1), numberPositions[beat].x, numberPositions[beat].y);
            context.fillStyle = active ? beatColor : colors.ink;
            context.fillText(String(beat + 1), numberPositions[beat].x, numberPositions[beat].y);
          }
          context.restore();
        }

        function bodyPath(x, y, size, offsetX = 0, offsetY = 0) {
          const path = new Path2D();
          path.moveTo(x - size * 0.35 + offsetX, y + offsetY);
          path.bezierCurveTo(
            x - size * 0.34 + offsetX,
            y - size * 0.24 + offsetY,
            x - size * 0.12 + offsetX,
            y - size * 0.31 + offsetY,
            x + size * 0.08 + offsetX,
            y - size * 0.29 + offsetY
          );
          path.bezierCurveTo(
            x + size * 0.29 + offsetX,
            y - size * 0.27 + offsetY,
            x + size * 0.36 + offsetX,
            y - size * 0.11 + offsetY,
            x + size * 0.35 + offsetX,
            y + offsetY
          );
          path.bezierCurveTo(
            x + size * 0.36 + offsetX,
            y + size * 0.22 + offsetY,
            x + size * 0.13 + offsetX,
            y + size * 0.31 + offsetY,
            x - size * 0.09 + offsetX,
            y + size * 0.29 + offsetY
          );
          path.bezierCurveTo(
            x - size * 0.3 + offsetX,
            y + size * 0.27 + offsetY,
            x - size * 0.36 + offsetX,
            y + size * 0.11 + offsetY,
            x - size * 0.35 + offsetX,
            y + offsetY
          );
          path.closePath();
          return path;
        }

        function drawCushion(x, y, size) {
          context.save();
          context.fillStyle = colors.ink;
          context.beginPath();
          context.ellipse(x + size * 0.018, y + size * 0.035, size * 0.32, size * 0.25, 0, 0, Math.PI * 2);
          context.fill();

          context.fillStyle = colors.washiLight;
          context.beginPath();
          context.ellipse(x, y, size * 0.305, size * 0.235, 0, 0, Math.PI * 2);
          context.fill();
          context.strokeStyle = colors.ink;
          context.lineWidth = size * 0.015;
          context.stroke();

          context.strokeStyle = colors.rust;
          context.lineWidth = size * 0.012;
          context.setLineDash([size * 0.026, size * 0.018]);
          context.beginPath();
          context.ellipse(x, y, size * 0.27, size * 0.2, 0, 0, Math.PI * 2);
          context.stroke();
          context.restore();
        }

        function drawMeritImprints(time, size) {
          const life = reducedMotion ? 650 : 1100;
          meritImprints = meritImprints.filter((imprint) => time - imprint.born < life);
          for (const imprint of meritImprints) {
            const rawProgress = Math.min(1, (time - imprint.born) / life);
            const enter = reducedMotion ? 1 : Math.min(1, rawProgress / 0.1);
            const fade = Math.pow(1 - rawProgress, reducedMotion ? 1 : 1.35);
            const fontSize = size * 0.235 * imprint.scale;
            context.save();
            context.translate(imprint.x, imprint.y);
            context.rotate(imprint.rotation);
            context.scale(0.82 + enter * 0.18, 0.82 + enter * 0.18);
            context.font = `${cssValue("--fontWeightSemibold")} ${fontSize}px ${cssValue("--fontFamilyInk")}`;
            context.textAlign = "center";
            context.textBaseline = "middle";
            context.fillStyle = colors.ink;
            context.globalAlpha = fade * 0.12;
            context.fillText("功德", -fontSize * 0.018, fontSize * 0.012);
            context.fillText("功德", fontSize * 0.014, -fontSize * 0.008);
            context.globalAlpha = fade * 0.58;
            context.fillText("功德", 0, 0);
            context.restore();
          }
        }

        function drawWoodMallet(baseX, baseY, headX, headY, angle, normalX, normalY, size, positiveImpact) {
          context.save();
          context.lineCap = "round";
          context.shadowColor = colors.shadow;
          context.shadowBlur = size * 0.028;
          const handleShade = context.createLinearGradient(
            baseX - normalX * size * 0.022,
            baseY - normalY * size * 0.022,
            baseX + normalX * size * 0.022,
            baseY + normalY * size * 0.022
          );
          handleShade.addColorStop(0, colors.woodDeep);
          handleShade.addColorStop(0.34, colors.woodHighlight);
          handleShade.addColorStop(0.64, colors.wood);
          handleShade.addColorStop(1, colors.woodDeep);
          context.strokeStyle = handleShade;
          context.lineWidth = size * 0.052;
          context.beginPath();
          context.moveTo(baseX, baseY);
          context.lineTo(headX, headY);
          context.stroke();
          context.shadowColor = "transparent";
          context.strokeStyle = colors.woodHighlight;
          context.globalAlpha = 0.58;
          context.lineWidth = size * 0.008;
          context.beginPath();
          context.moveTo(baseX - normalX * size * 0.009, baseY - normalY * size * 0.009);
          context.lineTo(headX - normalX * size * 0.009, headY - normalY * size * 0.009);
          context.stroke();

          context.translate(headX, headY);
          context.rotate(angle + Math.PI / 2);
          const headShade = context.createRadialGradient(
            -size * 0.024,
            -size * 0.018,
            size * 0.004,
            0,
            0,
            size * 0.098
          );
          headShade.addColorStop(0, colors.woodHighlight);
          headShade.addColorStop(0.36, positiveImpact > 0.5 ? colors.rust : colors.woodLight);
          headShade.addColorStop(0.72, colors.wood);
          headShade.addColorStop(1, colors.woodDeep);
          context.fillStyle = headShade;
          context.globalAlpha = 1;
          context.shadowColor = colors.shadow;
          context.shadowBlur = size * 0.025;
          context.beginPath();
          context.ellipse(0, 0, size * 0.098, size * 0.066, 0, 0, Math.PI * 2);
          context.fill();
          context.shadowColor = "transparent";
          context.strokeStyle = colors.woodDeep;
          context.lineWidth = size * 0.008;
          context.stroke();
          context.strokeStyle = colors.woodHighlight;
          context.globalAlpha = 0.62;
          context.lineWidth = size * 0.004;
          context.beginPath();
          context.ellipse(
            -size * 0.012,
            -size * 0.009,
            size * 0.067,
            size * 0.041,
            0,
            Math.PI * 1.06,
            Math.PI * 1.82
          );
          context.stroke();
          context.restore();
        }

        function drawCyberMallet(baseX, baseY, headX, headY, angle, normalX, normalY, size, positiveImpact) {
          context.save();
          context.lineCap = "round";
          context.shadowColor = colors.cyberGlow;
          context.shadowBlur = size * (0.038 + positiveImpact * 0.022);
          const handleShade = context.createLinearGradient(
            baseX - normalX * size * 0.03,
            baseY - normalY * size * 0.03,
            baseX + normalX * size * 0.03,
            baseY + normalY * size * 0.03
          );
          handleShade.addColorStop(0, colors.steelDark);
          handleShade.addColorStop(0.18, colors.steelMid);
          handleShade.addColorStop(0.36, colors.steelBright);
          handleShade.addColorStop(0.52, colors.steelLight);
          handleShade.addColorStop(0.72, colors.steelMid);
          handleShade.addColorStop(1, colors.steelDark);
          context.strokeStyle = handleShade;
          context.lineWidth = size * 0.058;
          context.beginPath();
          context.moveTo(baseX, baseY);
          context.lineTo(headX, headY);
          context.stroke();

          context.shadowColor = "transparent";
          context.strokeStyle = colors.steelBright;
          context.globalAlpha = 0.88;
          context.lineWidth = size * 0.009;
          context.beginPath();
          context.moveTo(baseX - normalX * size * 0.012, baseY - normalY * size * 0.012);
          context.lineTo(headX - normalX * size * 0.012, headY - normalY * size * 0.012);
          context.stroke();
          context.strokeStyle = colors.cyberCyan;
          context.globalAlpha = 0.82;
          context.lineWidth = size * 0.005;
          context.beginPath();
          context.moveTo(baseX + normalX * size * 0.018, baseY + normalY * size * 0.018);
          context.lineTo(headX + normalX * size * 0.018, headY + normalY * size * 0.018);
          context.stroke();

          for (let band = 1; band <= 5; band += 1) {
            const position = 0.11 + band * 0.14;
            const bandX = baseX + (headX - baseX) * position;
            const bandY = baseY + (headY - baseY) * position;
            context.strokeStyle = band % 2 === 0 ? colors.pink : colors.cyberCyan;
            context.globalAlpha = 0.82;
            context.lineWidth = size * 0.008;
            context.beginPath();
            context.moveTo(
              bandX - normalX * size * 0.036,
              bandY - normalY * size * 0.036
            );
            context.lineTo(
              bandX + normalX * size * 0.036,
              bandY + normalY * size * 0.036
            );
            context.stroke();
          }

          context.translate(headX, headY);
          context.rotate(angle + Math.PI / 2);
          const headWidth = size * 0.25;
          const headHeight = size * 0.14;
          const headShade = context.createLinearGradient(0, -headHeight * 0.5, 0, headHeight * 0.5);
          headShade.addColorStop(0, colors.steelDark);
          headShade.addColorStop(0.16, colors.steelMid);
          headShade.addColorStop(0.34, colors.steelBright);
          headShade.addColorStop(0.52, colors.steelLight);
          headShade.addColorStop(0.76, colors.steelMid);
          headShade.addColorStop(1, colors.steelDark);
          context.globalAlpha = 1;
          context.shadowColor = colors.cyberGlow;
          context.shadowBlur = size * (0.045 + positiveImpact * 0.04);
          context.fillStyle = headShade;
          context.strokeStyle = colors.steelDark;
          context.lineWidth = size * 0.009;
          context.beginPath();
          context.moveTo(-headWidth * 0.5, -headHeight * 0.22);
          context.lineTo(-headWidth * 0.36, -headHeight * 0.5);
          context.lineTo(headWidth * 0.36, -headHeight * 0.5);
          context.lineTo(headWidth * 0.5, -headHeight * 0.22);
          context.lineTo(headWidth * 0.5, headHeight * 0.22);
          context.lineTo(headWidth * 0.36, headHeight * 0.5);
          context.lineTo(-headWidth * 0.36, headHeight * 0.5);
          context.lineTo(-headWidth * 0.5, headHeight * 0.22);
          context.closePath();
          context.fill();
          context.stroke();

          context.shadowColor = "transparent";
          context.fillStyle = colors.steelDark;
          context.strokeStyle = colors.cyberCyan;
          context.lineWidth = size * 0.005;
          context.fillRect(-headWidth * 0.12, -headHeight * 0.48, headWidth * 0.24, headHeight * 0.96);
          context.strokeRect(-headWidth * 0.12, -headHeight * 0.48, headWidth * 0.24, headHeight * 0.96);

          context.strokeStyle = colors.steelBright;
          context.globalAlpha = 0.84;
          context.lineWidth = size * 0.006;
          context.beginPath();
          context.moveTo(-headWidth * 0.31, -headHeight * 0.26);
          context.lineTo(headWidth * 0.3, -headHeight * 0.26);
          context.stroke();

          const rivets = [
            [-0.32, -0.22],
            [0.32, -0.22],
            [-0.32, 0.22],
            [0.32, 0.22]
          ];
          for (const [rivetX, rivetY] of rivets) {
            context.fillStyle = colors.steelBright;
            context.strokeStyle = colors.steelDark;
            context.lineWidth = size * 0.004;
            context.beginPath();
            context.arc(
              headWidth * rivetX,
              headHeight * rivetY,
              size * 0.009,
              0,
              Math.PI * 2
            );
            context.fill();
            context.stroke();
          }

          context.shadowColor = colors.cyberGlow;
          context.shadowBlur = size * 0.035;
          context.fillStyle = positiveImpact > 0.45 ? colors.pink : colors.cyberCyan;
          context.strokeStyle = colors.steelBright;
          context.lineWidth = size * 0.005;
          context.beginPath();
          context.arc(0, 0, size * 0.026, 0, Math.PI * 2);
          context.fill();
          context.stroke();
          context.restore();
        }

        function drawWoodfish(x, y, size, time) {
          const elapsed = (time - woodStrikeStarted) / 1000;
          const duration = reducedMotion ? 0.001 : WOOD_STRIKE_DURATION;
          const progress = Math.min(1, Math.max(0, elapsed / duration));
          let impact = 0;
          let malletSwing = 0;

          if (elapsed >= 0 && elapsed <= duration) {
            if (progress < WOOD_IMPACT_PHASE) {
              const approach = progress / WOOD_IMPACT_PHASE;
              malletSwing = approach ** 3;
            } else {
              const release = (progress - WOOD_IMPACT_PHASE) / (1 - WOOD_IMPACT_PHASE);
              malletSwing = Math.pow(1 - release, 2.35);
              impact = Math.exp(-release * 9) * Math.cos(release * Math.PI * 3.2);
            }
          }

          const positiveImpact = Math.max(0, impact);
          const beatPhase = getRhythmPhase(time);
          const beatDistance = Math.min(beatPhase, 1 - beatPhase);
          const beatKick = reducedMotion ? 0 : Math.max(0, 1 - beatDistance * 12);
          const idle = reducedMotion ? 0 : Math.sin(time * 0.00052) * size * 0.002;
          const tiltX = pointerX * size * 0.012;
          const tiltY = pointerY * size * 0.009;
          const bodyX = x + tiltX;
          const bodyY = y + idle + tiltY - beatKick * size * 0.006 + positiveImpact * size * 0.008;
          const strikePointX = bodyX + size * 0.17;
          const strikePointY = bodyY + size * 0.13;

          drawEnso(x, y, size, time);
          drawMeritImprints(time, size);
          drawCushion(x, bodyY, size);

          context.save();
          context.translate(bodyX, bodyY);
          context.scale(
            1 + positiveImpact * 0.034 + beatKick * 0.006,
            1 - positiveImpact * 0.044 + beatKick * 0.006
          );
          context.translate(-bodyX, -bodyY);

          for (let layer = 5; layer >= 1; layer -= 1) {
            const depth = bodyPath(
              bodyX,
              bodyY,
              size,
              0,
              size * layer * 0.003
            );
            context.fillStyle = layer < 3 ? colors.woodMid : colors.woodDeep;
            context.globalAlpha = 0.72 + layer * 0.045;
            context.fill(depth);
          }
          context.globalAlpha = 1;

          const body = bodyPath(bodyX, bodyY, size);
          context.save();
          const woodShade = context.createRadialGradient(
            bodyX - size * 0.08,
            bodyY - size * 0.08,
            size * 0.02,
            bodyX,
            bodyY,
            size * 0.39
          );
          woodShade.addColorStop(0, colors.woodHighlight);
          woodShade.addColorStop(0.35, colors.woodLight);
          woodShade.addColorStop(0.74, colors.wood);
          woodShade.addColorStop(1, colors.woodDeep);
          context.fillStyle = woodShade;
          context.shadowColor = colors.shadow;
          context.shadowBlur = size * 0.055;
          context.shadowOffsetX = size * 0.014;
          context.shadowOffsetY = size * 0.024;
          context.fill(body);
          context.shadowColor = "transparent";

          context.clip(body);
          const volumeLight = context.createRadialGradient(
            bodyX - size * 0.13,
            bodyY - size * 0.18,
            size * 0.025,
            bodyX - size * 0.03,
            bodyY - size * 0.04,
            size * 0.43
          );
          volumeLight.addColorStop(0, colors.woodHighlight);
          volumeLight.addColorStop(0.42, colors.woodLight);
          volumeLight.addColorStop(1, colors.woodDeep);
          context.globalAlpha = 0.24;
          context.fillStyle = volumeLight;
          context.fillRect(
            bodyX - size * 0.36,
            bodyY - size * 0.39,
            size * 0.74,
            size * 0.78
          );

          context.strokeStyle = colors.woodDeep;
          context.lineCap = "round";
          for (let line = 0; line < 11; line += 1) {
            const offset = (line - 5) * size * 0.04;
            context.globalAlpha = 0.1 + (line % 3) * 0.035;
            context.lineWidth = size * (line % 3 === 0 ? 0.006 : 0.003);
            context.beginPath();
            context.moveTo(bodyX - size * 0.31, bodyY + offset);
            context.bezierCurveTo(
              bodyX - size * 0.12,
              bodyY + offset - size * 0.05,
              bodyX + size * 0.07,
              bodyY + offset + size * 0.055,
              bodyX + size * 0.32,
              bodyY + offset - size * 0.01
            );
            context.stroke();
          }
          context.restore();

          context.save();
          context.strokeStyle = woodHovered ? colors.rust : colors.ink;
          context.globalAlpha = 1;
          context.lineWidth = size * 0.016;
          context.stroke(body);
          context.strokeStyle = colors.woodHighlight;
          context.globalAlpha = 0.68;
          context.lineWidth = size * 0.006;
          context.beginPath();
          context.moveTo(bodyX - size * 0.25, bodyY - size * 0.12);
          context.bezierCurveTo(
            bodyX - size * 0.18,
            bodyY - size * 0.23,
            bodyX - size * 0.03,
            bodyY - size * 0.28,
            bodyX + size * 0.15,
            bodyY - size * 0.23
          );
          context.stroke();
          context.restore();

          context.save();
          context.lineCap = "round";
          context.shadowColor = colors.shadow;
          context.shadowBlur = size * 0.018;
          context.strokeStyle = colors.ink;
          context.lineWidth = size * 0.044;
          context.beginPath();
          context.moveTo(bodyX - size * 0.23, bodyY - size * 0.025);
          context.bezierCurveTo(
            bodyX - size * 0.08,
            bodyY - size * 0.11,
            bodyX + size * 0.14,
            bodyY - size * 0.1,
            bodyX + size * 0.24,
            bodyY - size * 0.005
          );
          context.stroke();
          context.shadowColor = "transparent";

          context.strokeStyle = colors.woodDeep;
          context.globalAlpha = 1;
          context.lineWidth = size * 0.018;
          context.beginPath();
          context.moveTo(bodyX - size * 0.22, bodyY - size * 0.02);
          context.bezierCurveTo(
            bodyX - size * 0.07,
            bodyY - size * 0.09,
            bodyX + size * 0.135,
            bodyY - size * 0.08,
            bodyX + size * 0.232,
            bodyY
          );
          context.stroke();

          context.strokeStyle = colors.woodHighlight;
          context.globalAlpha = 0.58;
          context.lineWidth = size * 0.005;
          context.beginPath();
          context.moveTo(bodyX - size * 0.21, bodyY - size * 0.055);
          context.bezierCurveTo(
            bodyX - size * 0.06,
            bodyY - size * 0.13,
            bodyX + size * 0.15,
            bodyY - size * 0.11,
            bodyX + size * 0.25,
            bodyY - size * 0.018
          );
          context.stroke();
          context.restore();

          context.save();
          for (const side of [-1, 1]) {
            const eyeX = bodyX + side * size * 0.225;
            const eyeY = bodyY + size * 0.015;
            context.fillStyle = colors.ink;
            context.beginPath();
            context.ellipse(
              eyeX,
              eyeY,
              size * 0.038,
              size * 0.052,
              side * 0.2,
              0,
              Math.PI * 2
            );
            context.fill();
            context.fillStyle = colors.rust;
            context.beginPath();
            context.arc(eyeX, eyeY, size * 0.015, 0, Math.PI * 2);
            context.fill();
            context.fillStyle = colors.washiLight;
            context.beginPath();
            context.arc(
              eyeX - side * size * 0.005,
              eyeY - size * 0.006,
              size * 0.004,
              0,
              Math.PI * 2
            );
            context.fill();
          }
          context.restore();

          if (positiveImpact > 0.05) {
            context.save();
            context.translate(strikePointX, strikePointY);
            context.globalAlpha = positiveImpact * 0.9;
            context.strokeStyle = colors.rust;
            context.lineWidth = Math.max(3, size * 0.012);
            context.lineCap = "square";
            for (let ray = 0; ray < 10; ray += 1) {
              const rayAngle = (ray / 10) * Math.PI * 2;
              const inner = size * 0.075;
              const outer = size * (0.12 + (ray % 3) * 0.022);
              context.beginPath();
              context.moveTo(Math.cos(rayAngle) * inner, Math.sin(rayAngle) * inner);
              context.lineTo(Math.cos(rayAngle) * outer, Math.sin(rayAngle) * outer);
              context.stroke();
            }
            context.fillStyle = colors.washiDeep;
            context.strokeStyle = colors.ink;
            context.lineWidth = Math.max(2, size * 0.007);
            context.beginPath();
            for (let point = 0; point < 16; point += 1) {
              const pointAngle = (point / 16) * Math.PI * 2;
              const pointRadius = size * (point % 2 === 0 ? 0.075 : 0.038);
              const pointX = Math.cos(pointAngle) * pointRadius;
              const pointY = Math.sin(pointAngle) * pointRadius;
              if (point === 0) context.moveTo(pointX, pointY);
              else context.lineTo(pointX, pointY);
            }
            context.closePath();
            context.fill();
            context.stroke();
            context.globalAlpha = positiveImpact * 0.5;
            context.shadowColor = colors.rust;
            context.shadowBlur = size * 0.055 * positiveImpact;
            context.fillStyle = colors.washiLight;
            context.beginPath();
            context.ellipse(
              0,
              0,
              size * 0.07,
              size * 0.028,
              -0.12,
              0,
              Math.PI * 2
            );
            context.fill();
            context.restore();
          }
          context.restore();

          const useCyberMallet = woodStrikeFromAuto
            && (autoActive || elapsed <= duration + 0.18);
          const baseX = useCyberMallet ? -size * 0.12 : x + size * 0.46;
          const baseY = useCyberMallet ? -size * 0.1 : canvasHeight + size * 0.08;
          const contactAngle = Math.atan2(strikePointY - baseY, strikePointX - baseX);
          const restAngle = contactAngle + (useCyberMallet ? -0.4 : 0.38);
          const angle = restAngle + (contactAngle - restAngle) * malletSwing;
          const handleLength = Math.hypot(strikePointX - baseX, strikePointY - baseY);
          const headX = baseX + Math.cos(angle) * handleLength;
          const headY = baseY + Math.sin(angle) * handleLength;
          const normalX = -Math.sin(angle);
          const normalY = Math.cos(angle);

          if (useCyberMallet) {
            drawCyberMallet(
              baseX,
              baseY,
              headX,
              headY,
              angle,
              normalX,
              normalY,
              size,
              positiveImpact
            );
          } else {
            drawWoodMallet(
              baseX,
              baseY,
              headX,
              headY,
              angle,
              normalX,
              normalY,
              size,
              positiveImpact
            );
          }
        }

        function drawWoodStrikeEmojis(x, y, size, time) {
          const impactTime = WOOD_STRIKE_DURATION * WOOD_IMPACT_PHASE;
          const elapsed = (time - woodStrikeStarted) / 1000 - impactTime;
          const effectDuration = reducedMotion ? 0.28 : 0.72;
          if (elapsed < 0 || elapsed > effectDuration) return;

          const anchorX = strikeEmojiAnchor.strikeStarted === woodStrikeStarted
            ? strikeEmojiAnchor.x
            : x + size * 0.17;
          const anchorY = strikeEmojiAnchor.strikeStarted === woodStrikeStarted
            ? strikeEmojiAnchor.y
            : y + size * 0.13;

          context.save();
          context.textAlign = "center";
          context.textBaseline = "middle";
          for (let index = 0; index < strikeEmojiParticles.length; index += 1) {
            const particle = strikeEmojiParticles[index];
            const particleElapsed = elapsed - particle.delay;
            if (particleElapsed < 0) continue;
            const progress = Math.min(
              1,
              particleElapsed / Math.max(0.01, effectDuration - particle.delay)
            );
            const alpha = reducedMotion
              ? 0.78
              : progress < 0.58 ? 1 : (1 - progress) / 0.42;
            const enter = reducedMotion ? 1 : Math.min(1, progress / 0.14);
            const radialDistance = size * particle.radius * (0.72 + enter * 0.28);
            const originX = anchorX + Math.cos(particle.angle) * radialDistance;
            const originY = anchorY + Math.sin(particle.angle) * radialDistance * 0.72;
            const drift = size * particle.driftX * progress;
            const lift = size * particle.lift * (1 - Math.pow(1 - progress, 2));
            const wobble = reducedMotion
              ? 0
              : Math.sin(progress * Math.PI * 2 + particle.angle) * size * 0.014;
            const emojiSize = size
              * (woodStrikeFromAuto ? 0.07 : 0.066)
              * particle.scale;
            context.save();
            context.translate(originX + drift + wobble, originY - lift);
            context.rotate(reducedMotion ? 0 : particle.rotation * (0.7 + progress * 0.3));
            context.scale(enter, enter);
            context.globalAlpha = Math.max(0, alpha);
            context.font = `${emojiSize}px "Apple Color Emoji", "Segoe UI Emoji", sans-serif`;
            context.fillText(particle.icon, 0, 0);
            context.restore();
          }
          context.restore();
        }

        function projectSea(x, y, width, height, lane, depth) {
          const clampedDepth = Math.max(0, Math.min(1, depth));
          const easedDepth = Math.pow(clampedDepth, 0.82);
          const nearY = y + height * 0.46;
          const horizonY = y - height * 0.43;
          const laneWidth = width * (0.48 - easedDepth * 0.41);
          return {
            x: x + lane * laneWidth,
            y: nearY + (horizonY - nearY) * easedDepth,
            scale: 1.65 - easedDepth * 1.38
          };
        }

        function createReleasedFish(item) {
          return {
            species: item,
            lane: 0,
            depth: 0.015,
            targetLane: (Math.random() - 0.5) * 1.45,
            speed: 0.065 + Math.random() * 0.035,
            size: 0.9 + Math.random() * 0.34,
            phase: Math.random() * Math.PI * 2,
            turnTimer: 2.2 + Math.random() * 3.8,
            wander: 0.08 + Math.random() * 0.12,
            age: 0
          };
        }

        function updateFish(delta) {
          if (reducedMotion) return;
          for (const fish of fishSchool) {
            fish.age += delta;
            fish.phase += delta * (2.8 + fish.speed * 6);
            fish.turnTimer -= delta;
            if (fish.turnTimer <= 0) {
              fish.targetLane = Math.max(-0.82, Math.min(0.82, fish.targetLane + (Math.random() - 0.5) * 0.62));
              fish.turnTimer = 2.2 + Math.random() * 4.8;
            }
            fish.lane += (fish.targetLane - fish.lane) * Math.min(1, delta * 0.72);
            fish.lane += Math.sin(fish.phase * 0.58) * delta * fish.wander;
            fish.lane = Math.max(-0.92, Math.min(0.92, fish.lane));
            fish.depth = Math.min(0.965, fish.depth + fish.speed * delta);
            if (fish.depth > 0.9) fish.speed *= Math.pow(0.985, delta * 60);
          }
          fishSchool = fishSchool.filter((fish) => fish.age < 34);
        }

        function drawFish(fish, projection, scale, angle, depthScale) {
          const bodyLength = scale * 0.105 * fish.size * depthScale;
          const bodyHeight = bodyLength * 0.42;
          const wobble = reducedMotion ? 0 : Math.sin(fish.phase * 3.2) * 0.12;

          context.save();
          context.translate(projection.x, projection.y);
          context.rotate(angle + wobble * 0.08);
          context.scale(1, 0.76);
          context.globalAlpha = 0.84;

          context.fillStyle = colors.lakeDeep;
          context.globalAlpha = 0.18;
          context.beginPath();
          context.ellipse(
            -bodyLength * 0.02,
            bodyHeight * 0.44,
            bodyLength * 0.54,
            bodyHeight * 0.26,
            0,
            0,
            Math.PI * 2
          );
          context.fill();

          context.globalAlpha = 0.86;
          const fishShade = context.createLinearGradient(
            -bodyLength * 0.48,
            -bodyHeight * 0.38,
            bodyLength * 0.48,
            bodyHeight * 0.38
          );
          fishShade.addColorStop(0, fish.species.accent);
          fishShade.addColorStop(0.42, fish.species.color);
          fishShade.addColorStop(1, colors.inkSoft);
          context.fillStyle = fishShade;
          context.beginPath();
          context.ellipse(0, 0, bodyLength * 0.5, bodyHeight * 0.5, 0, 0, Math.PI * 2);
          context.fill();

          context.beginPath();
          context.moveTo(-bodyLength * 0.46, 0);
          context.lineTo(-bodyLength * 0.78, -bodyHeight * (0.55 + wobble * 0.2));
          context.lineTo(-bodyLength * 0.72, bodyHeight * (0.55 - wobble * 0.2));
          context.closePath();
          context.fill();

          context.fillStyle = fish.species.accent;
          context.globalAlpha = 0.7;
          if (fish.species.pattern === "patch") {
            context.beginPath();
            context.ellipse(bodyLength * 0.08, -bodyHeight * 0.08, bodyLength * 0.16, bodyHeight * 0.24, 0.3, 0, Math.PI * 2);
            context.fill();
          } else if (fish.species.pattern === "stripe") {
            context.fillRect(-bodyLength * 0.08, -bodyHeight * 0.46, bodyLength * 0.12, bodyHeight * 0.92);
          } else if (fish.species.pattern === "scale") {
            context.strokeStyle = fish.species.accent;
            context.lineWidth = Math.max(0.7, bodyLength * 0.025);
            for (let stripe = -1; stripe <= 1; stripe += 1) {
              context.beginPath();
              context.arc(stripe * bodyLength * 0.12, 0, bodyHeight * 0.22, -1.2, 1.2);
              context.stroke();
            }
          } else if (fish.species.pattern === "fan") {
            context.beginPath();
            context.moveTo(-bodyLength * 0.54, 0);
            context.lineTo(-bodyLength * 0.9, -bodyHeight * 0.72);
            context.lineTo(-bodyLength * 0.82, bodyHeight * 0.72);
            context.closePath();
            context.fill();
          }

          context.globalAlpha = 0.92;
          context.fillStyle = colors.ink;
          context.beginPath();
          context.arc(bodyLength * 0.29, -bodyHeight * 0.11, Math.max(1, bodyLength * 0.035), 0, Math.PI * 2);
          context.fill();
          context.restore();
        }

        function drawSea(x, y, width, height, time, delta) {
          const scale = Math.min(width, height);
          const phase = reducedMotion ? 0.72 : getRhythmPhase(time);
          const left = x - width * 0.62;
          const top = y - height * 0.58;
          const seaWidth = width * 1.24;
          const seaHeight = height * 1.16;

          context.save();
          context.fillStyle = colors.lake;
          context.fillRect(left, top, seaWidth, seaHeight);

          context.fillStyle = colors.lakeDeep;
          context.globalAlpha = 0.72;
          context.beginPath();
          context.moveTo(left, y - height * 0.48);
          context.lineTo(left + seaWidth, y - height * 0.53);
          context.lineTo(left + seaWidth, y - height * 0.33);
          context.lineTo(left, y - height * 0.29);
          context.closePath();
          context.fill();

          context.globalAlpha = 0.22;
          context.fillStyle = colors.ink;
          const dotGap = Math.max(8, scale * 0.035);
          for (let dotY = y - height * 0.48; dotY < y - height * 0.25; dotY += dotGap) {
            for (let dotX = left; dotX < left + seaWidth; dotX += dotGap) {
              context.beginPath();
              context.arc(dotX, dotY, Math.max(1.2, scale * 0.006), 0, Math.PI * 2);
              context.fill();
            }
          }

          context.lineCap = "square";
          context.lineJoin = "miter";
          for (let band = 0; band < 11; band += 1) {
            const depth = band / 10;
            const center = projectSea(x, y, width, height, 0, depth);
            const travel = reducedMotion ? 0 : Math.sin(time * 0.0017 + band * 0.9) * scale * 0.014;
            const perspectiveWidth = width * (0.5 - depth * 0.4);
            context.strokeStyle = band % 3 === 0 ? colors.ink : colors.washiLight;
            context.globalAlpha = band % 3 === 0 ? 0.52 : 0.64;
            context.lineWidth = Math.max(2, scale * (0.006 + (1 - depth) * 0.009));
            context.beginPath();
            context.moveTo(center.x - perspectiveWidth, center.y + travel);
            context.lineTo(center.x - perspectiveWidth * 0.36, center.y - scale * 0.025 + travel);
            context.lineTo(center.x + perspectiveWidth * 0.18, center.y + scale * 0.018 + travel);
            context.lineTo(center.x + perspectiveWidth, center.y - scale * 0.01 + travel);
            context.stroke();
          }

          for (let beat = 0; beat < 4; beat += 1) {
            const travel = (phase + beat * 0.25) % 1;
            const depth = 1 - travel;
            const center = projectSea(x, y, width, height, 0, depth);
            const halfWidth = width * (0.035 + travel * 0.18);
            context.strokeStyle = beat === 0 ? colors.pink : colors.washiLight;
            context.globalAlpha = beat === 0 ? 1 : 0.62;
            context.lineWidth = Math.max(3, scale * (0.008 + travel * 0.01));
            context.beginPath();
            context.moveTo(center.x - halfWidth, center.y - scale * 0.018);
            context.lineTo(center.x, center.y + scale * 0.025);
            context.lineTo(center.x + halfWidth, center.y - scale * 0.018);
            context.stroke();
          }

          const entry = projectSea(x, y, width, height, 0, 0);
          const targetPulse = 0.7 + phase * 0.3;
          context.globalAlpha = 0.92;
          context.strokeStyle = colors.ink;
          context.fillStyle = colors.pink;
          context.lineWidth = Math.max(3, scale * 0.012);
          context.beginPath();
          context.moveTo(entry.x, entry.y - scale * 0.052 * targetPulse);
          context.lineTo(entry.x + scale * 0.052 * targetPulse, entry.y);
          context.lineTo(entry.x, entry.y + scale * 0.052 * targetPulse);
          context.lineTo(entry.x - scale * 0.052 * targetPulse, entry.y);
          context.closePath();
          context.fill();
          context.stroke();

          context.globalAlpha = 1;
          context.font = `${Math.max(26, scale * 0.075)}px "Apple Color Emoji", "Segoe UI Emoji", sans-serif`;
          context.textAlign = "center";
          context.textBaseline = "bottom";
          context.fillText("🫳", entry.x, entry.y - scale * 0.062);

          updateFish(delta);
          const projectedFish = fishSchool.map((fish) => {
            const projection = projectSea(x, y, width, height, fish.lane, fish.depth);
            const steer = fish.targetLane - fish.lane;
            return {
              fish,
              projection,
              angle: -Math.PI / 2 + steer * 0.48,
              depthScale: projection.scale
            };
          }).sort((first, second) => second.fish.depth - first.fish.depth);
          for (const item of projectedFish) {
            drawFish(item.fish, item.projection, scale, item.angle, item.depthScale);
          }

          context.restore();
        }

        function drawRipples(time) {
          ripples = ripples.filter((ripple) => time - ripple.born < ripple.life);
          for (const ripple of ripples) {
            const rawProgress = Math.min(1, (time - ripple.born) / ripple.life);
            const progress = reducedMotion ? 0.45 : rawProgress;
            const eased = 1 - Math.pow(1 - progress, 3);
            const radius = ripple.start + (ripple.end - ripple.start) * eased;
            context.save();
            context.globalAlpha = reducedMotion ? 0.62 : (1 - progress) * 0.78;
            context.strokeStyle = ripple.color;
            context.lineWidth = reducedMotion ? 2 : Math.max(1, 2.4 * (1 - progress));
            context.translate(ripple.x, ripple.y);
            context.scale(1, ripple.scaleY || 1);
            context.beginPath();
            context.arc(0, 0, radius, 0, Math.PI * 2);
            context.stroke();
            context.restore();
          }
        }

        function drawBursts(time, size) {
          const feedbackLife = (burst) => burst.rank === "miss"
            ? (reducedMotion ? 480 : 720)
            : (reducedMotion ? 900 : 1350);
          bursts = bursts.filter((burst) => time - burst.born < feedbackLife(burst));
          for (const burst of bursts) {
            const life = feedbackLife(burst);
            const rawProgress = Math.min(1, (time - burst.born) / life);
            if (burst.rank === "miss") {
              const missSize = Math.max(18, Math.min(32, size * 0.062));
              const rise = reducedMotion ? 0 : size * 0.025 * rawProgress;
              const alpha = reducedMotion ? 0.56 : Math.pow(1 - rawProgress, 1.2) * 0.62;
              context.save();
              context.translate(burst.x, burst.y - rise);
              context.rotate(burst.rotation * 0.25);
              context.globalAlpha = alpha;
              context.fillStyle = colors.inkSoft;
              context.font = `${cssValue("--fontWeightSemibold")} ${missSize}px ${cssValue("--fontFamilyBase")}`;
              context.textAlign = "center";
              context.textBaseline = "middle";
              context.fillText(`${burst.grade} · ${burst.gain}`, 0, 0);
              context.restore();
              continue;
            }
            const progress = reducedMotion ? 0.45 : rawProgress;
            const pop = reducedMotion ? 1 : (progress < 0.18
              ? 0.52 + (progress / 0.18) * 0.62
              : 1.14 - ((progress - 0.18) / 0.82) * 0.14);
            const rise = reducedMotion ? 0 : size * 0.1 * progress;
            const alpha = reducedMotion ? 1 : (progress < 0.7 ? 1 : 1 - (progress - 0.7) / 0.3);
            const baseGradeSize = Math.max(38, Math.min(90, size * 0.16));
            const gradeScale = burst.rank === "perfect"
              ? 1.18
              : burst.rank === "cool"
                ? 0.82
                : 1;
            const gradeSize = baseGradeSize * gradeScale * RATING_EFFECT_SCALE;
            const gainSize = Math.max(22, gradeSize * 0.46);
            const comboSize = Math.max(19, gradeSize * 0.38);
            const gradePalette = {
              perfect: { primary: colors.washiDeep, accent: colors.pink },
              cool: { primary: colors.lake, accent: colors.lime },
              miss: { primary: colors.washiLight, accent: colors.purple },
              good: { primary: colors.purple, accent: colors.rust }
            };
            const feedbackColors = gradePalette[burst.rank] || gradePalette.good;

            context.save();
            context.translate(burst.x, burst.y - rise);
            context.rotate(burst.rotation);
            context.scale(pop, pop);
            context.globalAlpha = alpha;
            context.strokeStyle = feedbackColors.accent;
            context.lineWidth = Math.max(3, gradeSize * 0.075);
            context.lineCap = "square";
            for (let ray = 0; ray < 12; ray += 1) {
              const angle = (ray / 12) * Math.PI * 2 + burst.seed;
              const inner = gradeSize * (1.22 + (ray % 2) * 0.08);
              const outer = gradeSize * (1.7 + ((ray + Math.floor(burst.seed * 10)) % 3) * 0.16);
              context.beginPath();
              context.moveTo(Math.cos(angle) * inner, Math.sin(angle) * inner * 0.55);
              context.lineTo(Math.cos(angle) * outer, Math.sin(angle) * outer * 0.55);
              context.stroke();
            }

            context.font = `${cssValue("--fontWeightBold")} ${gradeSize}px ${cssValue("--fontFamilyBase")}`;
            const gradeWidth = Math.max(gradeSize * 2.9, context.measureText(burst.grade).width + gradeSize * 0.7);
            context.fillStyle = feedbackColors.accent;
            context.strokeStyle = colors.ink;
            context.lineWidth = Math.max(3, gradeSize * 0.06);
            context.beginPath();
            context.moveTo(-gradeWidth * 0.53, -gradeSize * 0.48);
            context.lineTo(gradeWidth * 0.49, -gradeSize * 0.65);
            context.lineTo(gradeWidth * 0.54, gradeSize * 0.34);
            context.lineTo(-gradeWidth * 0.47, gradeSize * 0.53);
            context.closePath();
            context.fill();
            context.stroke();

            context.textAlign = "center";
            context.textBaseline = "middle";
            context.lineJoin = "round";
            context.lineWidth = Math.max(7, gradeSize * 0.17);
            context.strokeStyle = colors.washiLight;
            context.strokeText(burst.grade, 0, 0);
            context.lineWidth = Math.max(4, gradeSize * 0.09);
            context.strokeStyle = colors.ink;
            context.strokeText(burst.grade, 0, 0);
            context.fillStyle = feedbackColors.primary;
            context.fillText(burst.grade, 0, 0);

            context.save();
            context.translate(gradeSize * 0.5, gradeSize * 0.72);
            context.rotate(0.035);
            context.font = `${cssValue("--fontWeightBold")} ${gainSize}px ${cssValue("--fontFamilyBase")}`;
            const gainWidth = context.measureText(burst.gain).width + gainSize * 0.8;
            context.fillStyle = colors.washiLight;
            context.strokeStyle = colors.ink;
            context.lineWidth = Math.max(3, gainSize * 0.11);
            context.fillRect(-gainWidth * 0.5, -gainSize * 0.58, gainWidth, gainSize * 1.16);
            context.strokeRect(-gainWidth * 0.5, -gainSize * 0.58, gainWidth, gainSize * 1.16);
            context.fillStyle = colors.ink;
            context.fillText(burst.gain, 0, 0);
            context.restore();

            if (burst.combo) {
              context.save();
              context.translate(-gradeSize * 0.66, -gradeSize * 0.82);
              context.rotate(-0.045);
              context.font = `${cssValue("--fontWeightBold")} ${comboSize}px ${cssValue("--fontFamilyBase")}`;
              const comboWidth = context.measureText(burst.combo).width + comboSize * 0.72;
              context.fillStyle = colors.lime;
              context.strokeStyle = colors.ink;
              context.lineWidth = Math.max(3, comboSize * 0.12);
              context.beginPath();
              context.moveTo(-comboWidth * 0.52, -comboSize * 0.58);
              context.lineTo(comboWidth * 0.48, -comboSize * 0.48);
              context.lineTo(comboWidth * 0.53, comboSize * 0.52);
              context.lineTo(-comboWidth * 0.47, comboSize * 0.6);
              context.closePath();
              context.fill();
              context.stroke();
              context.fillStyle = colors.ink;
              context.fillText(burst.combo, 0, 0);
              context.restore();
            }

            context.font = `${cssValue("--fontWeightBold")} ${Math.max(13, comboSize * 0.68)}px ${cssValue("--fontFamilyBase")}`;
            context.fillStyle = colors.ink;
            context.globalAlpha = alpha * 0.78;
            context.fillText(burst.detail, -gradeSize * 0.92, gradeSize * 0.92);
            context.restore();
          }
        }

        function drawFeverBackdrop(time) {
          if (!isFeverActive(time)) return;
          const elapsed = Math.max(0, time - feverStarted);
          const minSide = Math.min(canvasWidth, canvasHeight);
          const dotGap = Math.max(18, minSide * 0.036);
          context.save();
          context.globalAlpha = 0.94;
          context.fillStyle = colors.ink;
          context.fillRect(0, 0, canvasWidth, canvasHeight);
          context.fillStyle = colors.purple;
          context.globalAlpha = 0.16;
          const drift = reducedMotion ? 0 : (elapsed * 0.018) % dotGap;
          for (let dotY = -dotGap + drift; dotY < canvasHeight + dotGap; dotY += dotGap) {
            for (let dotX = -dotGap; dotX < canvasWidth + dotGap; dotX += dotGap) {
              const offsetX = (Math.floor(dotY / dotGap) % 2) * dotGap * 0.5;
              context.beginPath();
              context.arc(
                dotX + offsetX,
                dotY,
                Math.max(1.8, minSide * 0.0045),
                0,
                Math.PI * 2
              );
              context.fill();
            }
          }
          context.restore();
        }

        function drawFever(time, geometry) {
          if (!isFeverActive(time)) {
            if (feverWasActive) {
              feverWasActive = false;
              document.body.removeAttribute("data-fever");
              announce(mode === "merit" ? "功德时刻结束" : "放生时刻结束");
            }
            return;
          }

          const elapsed = Math.max(0, time - feverStarted);
          const remainingSeconds = Math.max(1, Math.ceil((feverUntil - time) / 1000));
          const minSide = Math.min(canvasWidth, canvasHeight);
          const pulse = reducedMotion ? 1 : 1 + Math.sin(elapsed * 0.018) * 0.045;
          const spin = reducedMotion ? 0 : elapsed * 0.00018;
          const effectColors = [colors.washiDeep, colors.pink, colors.lake, colors.purple];
          const colorIndex = reducedMotion ? 0 : Math.floor(elapsed / 260) % effectColors.length;
          const primary = effectColors[colorIndex];
          const secondary = effectColors[(colorIndex + 1) % effectColors.length];
          const edgeWidth = Math.max(8, minSide * 0.014);

          context.save();
          context.strokeStyle = primary;
          context.globalAlpha = 0.92;
          context.lineWidth = edgeWidth;
          context.setLineDash([edgeWidth * 2.2, edgeWidth * 1.05]);
          context.lineDashOffset = reducedMotion ? 0 : -elapsed * 0.055;
          context.strokeRect(
            edgeWidth * 0.55,
            edgeWidth * 0.55,
            canvasWidth - edgeWidth * 1.1,
            canvasHeight - edgeWidth * 1.1
          );
          context.setLineDash([]);

          const outerRadius = Math.hypot(
            Math.max(geometry.x, canvasWidth - geometry.x),
            Math.max(geometry.y, canvasHeight - geometry.y)
          );
          context.lineCap = "square";
          for (let ray = 0; ray < 24; ray += 1) {
            const angle = (ray / 24) * Math.PI * 2 + spin;
            const inner = geometry.size * (0.52 + (ray % 3) * 0.025);
            const outer = outerRadius * (0.88 + (ray % 4) * 0.035);
            context.strokeStyle = ray % 2 === 0 ? primary : secondary;
            context.globalAlpha = 0.12 + (ray % 3) * 0.025;
            context.lineWidth = Math.max(2, minSide * (ray % 2 === 0 ? 0.006 : 0.003));
            context.beginPath();
            context.moveTo(
              geometry.x + Math.cos(angle) * inner,
              geometry.y + Math.sin(angle) * inner
            );
            context.lineTo(
              geometry.x + Math.cos(angle) * outer,
              geometry.y + Math.sin(angle) * outer
            );
            context.stroke();
          }

          const chipRadius = geometry.size * 0.58 * pulse;
          for (let chip = 0; chip < PERFECT_FEVER_THRESHOLD; chip += 1) {
            const angle = (chip / PERFECT_FEVER_THRESHOLD) * Math.PI * 2 - spin * 1.8;
            const chipSize = Math.max(5, geometry.size * (chip % 2 === 0 ? 0.018 : 0.012));
            context.save();
            context.translate(
              geometry.x + Math.cos(angle) * chipRadius,
              geometry.y + Math.sin(angle) * chipRadius * 0.78
            );
            context.rotate(angle + Math.PI * 0.25);
            context.globalAlpha = 0.78;
            context.fillStyle = chip % 2 === 0 ? primary : secondary;
            context.strokeStyle = colors.ink;
            context.lineWidth = Math.max(1.5, chipSize * 0.22);
            context.fillRect(-chipSize, -chipSize, chipSize * 2, chipSize * 2);
            context.strokeRect(-chipSize, -chipSize, chipSize * 2, chipSize * 2);
            context.restore();
          }

          context.save();
          context.textAlign = "center";
          context.textBaseline = "middle";
          for (let prayer = 0; prayer < 11; prayer += 1) {
            const prayerSize = Math.max(24, minSide * (0.045 + (prayer % 4) * 0.008));
            const lane = ((prayer * 0.237 + 0.08) % 0.88) + 0.04;
            const travelRange = canvasHeight + prayerSize * 3;
            const travel = reducedMotion
              ? (prayer * 0.091 % 1) * travelRange
              : (elapsed * (0.028 + (prayer % 3) * 0.006) + prayer * 137) % travelRange;
            const prayerY = canvasHeight + prayerSize - travel;
            const prayerPulse = reducedMotion ? 1 : 0.88 + Math.sin(elapsed * 0.01 + prayer) * 0.12;
            context.save();
            context.translate(canvasWidth * lane, prayerY);
            context.scale(prayerPulse, prayerPulse);
            context.rotate((prayer % 2 === 0 ? -1 : 1) * 0.08);
            context.globalAlpha = 0.48 + (prayer % 3) * 0.12;
            context.font = `${prayerSize}px "Apple Color Emoji", "Segoe UI Emoji", sans-serif`;
            context.fillText("🙏", 0, 0);
            context.restore();
          }
          context.restore();

          const titleSize = Math.max(25, Math.min(52, geometry.size * 0.105));
          const bannerWidth = Math.min(
            canvasWidth - Math.max(24, edgeWidth * 2.2),
            Math.max(250, titleSize * 7.2)
          );
          const bannerHeight = titleSize * 1.72;
          const bannerY = Math.max(
            92,
            Math.min(canvasHeight - bannerHeight, geometry.y - geometry.size * 0.31)
          );
          context.translate(geometry.x, bannerY);
          context.rotate(-0.025);
          context.globalAlpha = 0.96;
          context.fillStyle = colors.washiDeep;
          context.strokeStyle = colors.ink;
          context.lineWidth = Math.max(3, titleSize * 0.09);
          context.beginPath();
          context.moveTo(-bannerWidth * 0.52, -bannerHeight * 0.43);
          context.lineTo(bannerWidth * 0.48, -bannerHeight * 0.54);
          context.lineTo(bannerWidth * 0.52, bannerHeight * 0.35);
          context.lineTo(-bannerWidth * 0.46, bannerHeight * 0.5);
          context.closePath();
          context.fill();
          context.stroke();

          context.textAlign = "center";
          context.textBaseline = "middle";
          context.lineJoin = "round";
          context.font = `${cssValue("--fontWeightBold")} ${titleSize}px ${cssValue("--fontFamilyBase")}`;
          context.lineWidth = Math.max(5, titleSize * 0.14);
          context.strokeStyle = colors.ink;
          context.strokeText(`PERFECT ×${PERFECT_FEVER_THRESHOLD}`, 0, -titleSize * 0.14);
          context.fillStyle = primary;
          context.fillText(`PERFECT ×${PERFECT_FEVER_THRESHOLD}`, 0, -titleSize * 0.14);

          context.font = `${cssValue("--fontWeightBold")} ${Math.max(14, titleSize * 0.38)}px ${cssValue("--fontFamilyBase")}`;
          context.fillStyle = colors.ink;
          context.fillText(
            `${mode === "merit" ? "功德时刻" : "放生时刻"} · ${remainingSeconds}s`,
            0,
            titleSize * 0.58
          );
          context.restore();
        }

        function updateSessionMissClock(time, geometry) {
          if (
            fortuneOpen
            || fortunePending
            || sessionActionCount < 1
            || document.hidden
          ) {
            return;
          }

          if (autoActive || isFeverActive(time)) {
            sessionMissAnchor = time;
            return;
          }

          const beatDuration = MODES[mode].autoDelay;
          if (!sessionMissAnchor) sessionMissAnchor = time;

          while (time - sessionMissAnchor >= beatDuration && sessionMissCount < 2) {
            sessionMissAnchor += beatDuration;
            sessionMissCount += 1;
            comboCount = 0;
            perfectStreak = 0;
            lastTimingGrade = "MISS";
            addBurst(
              { label: "MISS", rank: "miss" },
              sessionMissCount === 1 ? "1 / 2" : "2 / 2 · 抽签",
              "",
              geometry,
              mode
            );
            renderUi();

            if (sessionMissCount === 1) {
              announce("MISS，下一拍仍未操作将自动抽签");
              continue;
            }

            fortunePending = true;
            window.clearTimeout(idleHintTimer);
            idleHint.hidden = true;
            announce("连续 MISS 两拍，正在抽签");
            fortuneTimer = window.setTimeout(
              showFortuneSummary,
              reducedMotion ? 120 : 320
            );
            break;
          }
        }

        function draw(time) {
          const delta = Math.min(0.05, Math.max(0, (time - lastFrame) / 1000));
          lastFrame = time;
          context.clearRect(0, 0, canvasWidth, canvasHeight);
          drawPaperTexture(time);
          drawFeverBackdrop(time);

          const geometry = stageGeometry();
          updateSessionMissClock(time, geometry);
          if (mode === "merit") {
            drawWoodfish(geometry.x, geometry.y, geometry.size, time);
            drawWoodStrikeEmojis(geometry.x, geometry.y, geometry.size, time);
          } else {
            drawSea(
              geometry.x,
              geometry.y,
              geometry.width,
              geometry.height,
              time,
              delta
            );
          }
          drawRipples(time);
          drawFever(time, geometry);
          drawBursts(time, geometry.size);
        }

        function frame(time) {
          draw(time);
          animationFrame = window.requestAnimationFrame(frame);
        }

        function startAnimation() {
          if (animationFrame) return;
          lastFrame = performance.now();
          animationFrame = window.requestAnimationFrame(frame);
        }

        function stopAnimation() {
          if (!animationFrame) return;
          window.cancelAnimationFrame(animationFrame);
          animationFrame = 0;
        }

        function handleTabKeydown(event) {
          if (!["ArrowLeft", "ArrowRight", "Home", "End"].includes(event.key)) return;
          event.preventDefault();
          if (event.key === "Home") {
            setMode("merit", true);
          } else if (event.key === "End") {
            setMode("release", true);
          } else {
            setMode(mode === "merit" ? "release" : "merit", true);
          }
        }

        meritTab.addEventListener("click", () => setMode("merit"));
        releaseTab.addEventListener("click", () => setMode("release"));
        meritTab.addEventListener("keydown", handleTabKeydown);
        releaseTab.addEventListener("keydown", handleTabKeydown);
        meritAction.addEventListener("click", () => strikeMerit(false));
        releaseAction.addEventListener("click", () => releaseFish(false));
        autoToggle.addEventListener("click", toggleAuto);
        soundToggle.addEventListener("click", toggleSound);
        fortuneContinue.addEventListener("click", () => closeFortuneSummary());

        meritAction.addEventListener("pointerenter", () => {
          woodHovered = true;
        });
        meritAction.addEventListener("pointerleave", () => {
          woodHovered = false;
          pointerX = 0;
          pointerY = 0;
        });
        meritAction.addEventListener("pointermove", (event) => {
          const bounds = meritAction.getBoundingClientRect();
          pointerX = ((event.clientX - bounds.left) / bounds.width) * 2 - 1;
          pointerY = ((event.clientY - bounds.top) / bounds.height) * 2 - 1;
        });
        meritAction.addEventListener("focus", () => {
          woodHovered = true;
        });
        meritAction.addEventListener("blur", () => {
          woodHovered = false;
        });

        document.addEventListener("keydown", (event) => {
          if (fortuneOpen) {
            if (event.key === "Escape") {
              event.preventDefault();
              closeFortuneSummary();
            } else if (event.key === "Tab") {
              event.preventDefault();
              fortuneContinue.focus();
            }
            return;
          }
          resetIdleHint();
          const target = event.target;
          const isTyping = target instanceof HTMLInputElement
            || target instanceof HTMLTextAreaElement
            || target instanceof HTMLSelectElement
            || target.isContentEditable;
          const isInteractive = target instanceof Element
            && Boolean(target.closest("button, a, input, textarea, select, [contenteditable='true']"));
          const isUnmodifiedSpace = event.code === "Space"
            && !event.altKey
            && !event.ctrlKey
            && !event.metaKey
            && !event.shiftKey;
          if (isUnmodifiedSpace && !isTyping && !isInteractive) {
            event.preventDefault();
            performCurrentAction(false);
          }
        });

        window.addEventListener("resize", resizeCanvas, { passive: true });
        document.addEventListener("pointerdown", resetIdleHint, { passive: true, capture: true });
        document.addEventListener("visibilitychange", () => {
          if (document.hidden) {
            window.clearTimeout(idleHintTimer);
            idleHint.hidden = true;
            stopAnimation();
            stopAuto(false);
            if (audioContext && audioContext.state === "running") {
              audioContext.suspend().catch(() => {
                setSystemMessage(STRINGS.audioBlocked);
              });
            }
          } else {
            if (sessionActionCount > 0) sessionMissAnchor = performance.now();
            startAnimation();
            resetIdleHint();
          }
        });

        const handleReducedMotion = (event) => {
          reducedMotion = event.matches;
          ripples = [];
          bursts = [];
        };
        if (reducedMotionQuery.addEventListener) {
          reducedMotionQuery.addEventListener("change", handleReducedMotion);
        } else {
          reducedMotionQuery.addListener(handleReducedMotion);
        }

        window.setInterval(() => {
          if (document.hidden) return;
          if (demoTick % 2 === 0) demoRemoteMerit += 1;
          if (demoTick % 3 === 0) demoRemoteRelease += 1;
          demoTick += 1;
          renderUi();
        }, 5200);

        loadState();
        renderUi();
        resizeCanvas();
        startAnimation();
        resetIdleHint();
        resolveLocation();

        window.__ritualPrototype = {
          merit: () => strikeMerit(false),
          meritPerfect: () => strikeMerit(true),
          release: () => releaseFish(false),
          releasePerfect: () => releaseFish(true),
          previewMiss: () => {
            addBurst(
              { label: "MISS", rank: "miss" },
              "1 / 2",
              "",
              stageGeometry(),
              mode
            );
          },
          showFortune: (level = "", keyword = "") => {
            if (sessionActionCount < 1) sessionActionCount = 1;
            showFortuneSummary(level, keyword);
          },
          closeFortune: closeFortuneSummary,
          getFortuneMessages: () => FORTUNE_MESSAGES.map((message) => ({ ...message })),
          triggerFever: () => {
            perfectStreak = PERFECT_FEVER_THRESHOLD;
            comboCount = Math.max(comboCount, PERFECT_FEVER_THRESHOLD);
            triggerFever();
          },
          setMode,
          toggleAuto,
          draw: () => draw(performance.now()),
          get state() {
            return {
              mode,
              merit: meritTotal,
              release: releaseTotal,
              global: getDemoGlobal(),
              sound: soundEnabled,
              auto: autoActive,
              fish: fishSchool.length,
              fishDirections: fishSchool.slice(-8).map((fish) => ({
                lane: Number(fish.lane.toFixed(3)),
                depth: Number(fish.depth.toFixed(3)),
                targetLane: Number(fish.targetLane.toFixed(3))
              })),
              rhythmPhase: Number(getRhythmPhase().toFixed(3)),
              rhythmBeat: ((rhythmBeatIndex + Math.floor((performance.now() - rhythmEpoch) / MODES[mode].autoDelay)) % 4 + 4) % 4 + 1,
              timingGrade: lastTimingGrade,
              combo: comboCount,
              perfectStreak,
              feverActive: isFeverActive(),
              feverRemainingMs: Math.max(0, Math.round(feverUntil - performance.now())),
              sessionActions: sessionActionCount,
              sessionMisses: sessionMissCount,
              fortuneOpen,
              fortunePending,
              fortuneClosing,
              fortuneTone,
              fortuneMessage: {
                keyword: fortuneKeyword.textContent,
                english: fortuneEnglish.textContent,
                description: fortuneExplanation.textContent
              },
              woodStrikeFromAuto,
              woodStrikeElapsedMs: Number.isFinite(woodStrikeStarted)
                ? Math.max(0, Math.round(performance.now() - woodStrikeStarted))
                : null,
              woodImpactAtMs: Math.round(WOOD_STRIKE_DURATION * WOOD_IMPACT_PHASE * 1000),
              woodStrikeDurationMs: Math.round(WOOD_STRIKE_DURATION * 1000),
              malletOrigin: woodStrikeFromAuto
                && (
                  autoActive
                  || performance.now() - woodStrikeStarted <= (WOOD_STRIKE_DURATION + 0.18) * 1000
                )
                ? "top-left"
                : "bottom",
              malletMaterial: woodStrikeFromAuto
                && (
                  autoActive
                  || performance.now() - woodStrikeStarted <= (WOOD_STRIKE_DURATION + 0.18) * 1000
                )
                ? "cyber-stainless"
                : "wood",
              strikeEmojis: strikeEmojiParticles.map((particle) => particle.icon),
              strikeEmojiAnchor: {
                x: Math.round(strikeEmojiAnchor.x),
                y: Math.round(strikeEmojiAnchor.y)
              },
              strikeEmojiLayout: strikeEmojiParticles.map((particle) => ({
                icon: particle.icon,
                angle: Number(particle.angle.toFixed(3)),
                radius: Number(particle.radius.toFixed(3)),
                driftX: Number(particle.driftX.toFixed(3)),
                lift: Number(particle.lift.toFixed(3))
              })),
              bursts: bursts.length,
              feedback: bursts.slice(-10).map((burst) => ({
                rank: burst.rank,
                type: burst.type,
                x: Math.round(burst.x),
                y: Math.round(burst.y)
              })),
              idleHintVisible: !idleHint.hidden,
              imprints: meritImprints.length,
              ripples: ripples.length,
              storage: storageAvailable,
              reducedMotion
            };
          }
        };
      })();
    </script>

  </body>
</html>
