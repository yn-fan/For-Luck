<!doctype html>
<html lang="zh-CN" data-product="other" data-location-endpoint="">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta
      name="description"
      content="佛了 for luck：在原创复古漫画网点风格的木鱼与无边海之间切换，跟随节拍积攒功德，或放生一尾鱼。"
    />
    <title>佛了 for luck · 此地</title>

    <style>
      /*
       * Fluent v9 generic token base.
       * Source: @fluentui/tokens (Fluent UI React v9) — light theme defaults.
       */
      :root {
        --colorNeutralForeground1: #242424;
        --colorNeutralForeground2: #424242;
        --colorNeutralForeground3: #616161;
        --colorNeutralForeground4: #707070;
        --colorNeutralForegroundDisabled: #bdbdbd;
        --colorNeutralBackground1: #ffffff;
        --colorNeutralBackground2: #fafafa;
        --colorNeutralBackground3: #f5f5f5;
        --colorNeutralBackground4: #f0f0f0;
        --colorNeutralBackground5: #ebebeb;
        --colorNeutralBackground6: #e6e6e6;
        --colorBrandBackground: #0f6cbd;
        --colorBrandBackgroundHover: #115ea3;
        --colorBrandBackgroundPressed: #0c3b5e;
        --colorBrandForeground1: #0f6cbd;
        --colorBrandForeground2: #115ea3;
        --colorBrandForegroundLink: #0f6cbd;
        --colorBrandForegroundLinkHover: #115ea3;
        --colorPaletteRedForeground1: #d13438;
        --colorPaletteGreenForeground1: #107c10;
        --colorPaletteYellowForeground1: #bc4b00;
        --colorPaletteRedBackground1: #fdf3f4;
        --colorPaletteGreenBackground1: #f1faf1;
        --colorPaletteYellowBackground1: #fff4ce;
        --colorNeutralStroke1: #d1d1d1;
        --colorNeutralStroke2: #e0e0e0;
        --colorNeutralStroke3: #f0f0f0;
        --colorNeutralStrokeAccessible: #616161;
        --spacingHorizontalXXS: 2px;
        --spacingHorizontalXS: 4px;
        --spacingHorizontalSNudge: 6px;
        --spacingHorizontalS: 8px;
        --spacingHorizontalMNudge: 10px;
        --spacingHorizontalM: 12px;
        --spacingHorizontalL: 16px;
        --spacingHorizontalXL: 20px;
        --spacingHorizontalXXL: 24px;
        --spacingHorizontalXXXL: 32px;
        --spacingVerticalXXS: 2px;
        --spacingVerticalXS: 4px;
        --spacingVerticalSNudge: 6px;
        --spacingVerticalS: 8px;
        --spacingVerticalMNudge: 10px;
        --spacingVerticalM: 12px;
        --spacingVerticalL: 16px;
        --spacingVerticalXL: 20px;
        --spacingVerticalXXL: 24px;
        --spacingVerticalXXXL: 32px;
        --borderRadiusNone: 0;
        --borderRadiusSmall: 2px;
        --borderRadiusMedium: 4px;
        --borderRadiusLarge: 6px;
        --borderRadiusXLarge: 8px;
        --borderRadiusCircular: 10000px;
        --fontFamilyBase: "Segoe UI", "Segoe UI Variable", system-ui, -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
        --fontFamilyMonospace: "Cascadia Code", Consolas, "Courier New", monospace;
        --fontSizeBase100: 10px;
        --fontSizeBase200: 12px;
        --fontSizeBase300: 14px;
        --fontSizeBase400: 16px;
        --fontSizeBase500: 20px;
        --fontSizeBase600: 24px;
        --fontSizeHero700: 28px;
        --fontSizeHero800: 32px;
        --fontSizeHero900: 40px;
        --fontSizeHero1000: 68px;
        --lineHeightBase100: 14px;
        --lineHeightBase200: 16px;
        --lineHeightBase300: 20px;
        --lineHeightBase400: 22px;
        --lineHeightBase500: 28px;
        --lineHeightBase600: 32px;
        --lineHeightHero700: 36px;
        --lineHeightHero800: 40px;
        --lineHeightHero900: 52px;
        --lineHeightHero1000: 92px;
        --fontWeightRegular: 400;
        --fontWeightMedium: 500;
        --fontWeightSemibold: 600;
        --fontWeightBold: 700;
        --shadow2: 0 1px 2px rgba(0, 0, 0, 0.14), 0 0 2px rgba(0, 0, 0, 0.12);
        --shadow4: 0 2px 4px rgba(0, 0, 0, 0.14), 0 0 2px rgba(0, 0, 0, 0.12);
        --shadow8: 0 4px 8px rgba(0, 0, 0, 0.14), 0 0 2px rgba(0, 0, 0, 0.12);
        --shadow16: 0 8px 16px rgba(0, 0, 0, 0.14), 0 0 2px rgba(0, 0, 0, 0.12);
        --shadow28: 0 14px 28px rgba(0, 0, 0, 0.24), 0 0 8px rgba(0, 0, 0, 0.20);
        --shadow64: 0 32px 64px rgba(0, 0, 0, 0.24), 0 0 8px rgba(0, 0, 0, 0.20);
        --durationUltraFast: 50ms;
        --durationFaster: 100ms;
        --durationFast: 150ms;
        --durationNormal: 200ms;
        --durationSlow: 300ms;
        --durationSlower: 400ms;
        --durationFortuneMotion: 500ms;
        --durationFortuneBurn: 760ms;
        --curveEasyEase: cubic-bezier(0.33, 0, 0.67, 1);
        --curveAccelerateMax: cubic-bezier(1, 0, 1, 1);
        --curveDecelerateMax: cubic-bezier(0, 0, 0, 1);

        /* Original bright Memphis rhythm-game theme overlay. */
        --colorWashi: #fff6df;
        --colorWashiLight: #ffffff;
        --colorWashiDeep: #ffd166;
        --colorInk: #27263a;
        --colorInkSoft: #3d3c56;
        --colorInkFaint: #5e5d76;
        --colorFortuneDark: #111019;
        --colorRust: #ff6f61;
        --colorRustDeep: #c13b57;
        --colorMoss: #45d6a9;
        --colorMossDeep: #158f7c;
        --colorLake: #4fc3f7;
        --colorLakeDeep: #3e78d8;
        --colorLakeLight: #d8f4ff;
        --colorSand: #ffd166;
        --colorSandDeep: #e59f32;
        --colorWood: #b96d48;
        --colorWoodMid: #8e5039;
        --colorWoodDeep: #543328;
        --colorWoodLight: #e7a76d;
        --colorWoodHighlight: #ffdda4;
        --colorSteelDark: #26323f;
        --colorSteelMid: #7f93a1;
        --colorSteelLight: #dceaf0;
        --colorSteelBright: #f8fdff;
        --colorCyberCyan: #4de9ff;
        --colorCyberGlow: rgba(77, 233, 255, 0.72);
        --colorAccentPurple: #6548d9;
        --colorAccentPink: #ff5ca8;
        --colorAccentLime: #b9e84a;
        --colorAccentOrange: #ff9f43;
        --colorPaperAlpha: rgba(255, 255, 255, 0.94);
        --colorInkAlpha: rgba(39, 38, 58, 0.24);
        --colorInkFaintAlpha: rgba(39, 38, 58, 0.12);
        --colorShadowAlpha: rgba(39, 38, 58, 0.24);
        --colorModalBackdrop: rgba(39, 38, 58, 0.9);
        --colorLakeAlpha: rgba(79, 195, 247, 0.3);
        --colorFishKoi: #ff6f61;
        --colorFishGreen: #2bbd91;
        --colorFishCrucian: #6548d9;
        --colorFishGold: #ffb83e;
        --colorFishBitterling: #ff5ca8;
        --colorFishSilver: #f7fbff;
        --fontFamilyBase: "Segoe UI Variable Display", "Segoe UI", sans-serif;
        --fontFamilyInk: "Kaiti SC", "STKaiti", "KaiTi", "FangSong", serif;
        --fontSizeFortune: clamp(64px, 18vw, 92px);
        --fontSizeFortuneKeyword: clamp(30px, 9vw, 42px);
        --lineHeightFortune: 1;
        --contentMaxWidth: 1480px;
        --stageSize: clamp(320px, 64vmin, 660px);
        --releaseStageMax: 1060px;
        --controlMinSize: 44px;
        --safePadTop: calc(var(--spacingVerticalL) + env(safe-area-inset-top));
        --safePadRight: calc(var(--spacingHorizontalXXL) + env(safe-area-inset-right));
        --safePadBottom: calc(var(--spacingVerticalL) + env(safe-area-inset-bottom));
        --safePadLeft: calc(var(--spacingHorizontalXXL) + env(safe-area-inset-left));
        --focusRingWidth: 3px;
        --focusRingOffset: 5px;
        --strokeThin: 2px;
        --strokeMedium: 3px;
        --titleTracking: 0;
        --labelTracking: 0.04em;
        --microTracking: 0.03em;
        --controlPadBlock: 10px;
        --controlPadInline: 15px;
        --hoverOffset: -2px;
        --pressScale: 0.985;
        --rhythmPeriod: 960ms;
        --idleCueSize: 72px;
        --fortuneTitleLift: -40px;
        --durationReducedMotion: 1ms;
      }

      *, *::before, *::after {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
      }

      body {
        overflow: hidden;
        color: var(--colorInk);
        background: var(--colorWashi);
        font-family: var(--fontFamilyBase);
        font-size: var(--fontSizeBase300);
        line-height: var(--lineHeightBase300);
        text-wrap: pretty;
        -webkit-font-smoothing: antialiased;
      }

      button {
        font: inherit;
      }

      button[class]:focus-visible {
        outline: var(--focusRingWidth) solid var(--colorWashiLight);
        outline-offset: var(--spacingHorizontalXXS);
        box-shadow: 0 0 0 calc(var(--focusRingWidth) + var(--focusRingWidth)) var(--colorInk);
      }

      #sceneCanvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }

      .screen {
        position: relative;
        z-index: 1;
        min-height: 100svh;
        display: grid;
        grid-template-rows: auto 1fr auto auto;
        gap: var(--spacingVerticalM);
        width: 100%;
        max-width: var(--contentMaxWidth);
        margin: 0 auto;
        padding:
          var(--safePadTop)
          var(--safePadRight)
          var(--safePadBottom)
          var(--safePadLeft);
      }

      .topbar {
        display: grid;
        grid-template-columns: minmax(230px, 1fr) auto;
        grid-template-areas: "brand modes";
        align-items: center;
        gap: var(--spacingHorizontalXL);
      }

      .brand {
        grid-area: brand;
        display: grid;
        grid-template-areas:
          "title"
          "subtitle";
        justify-self: start;
        gap: var(--spacingVerticalXXS);
        padding: var(--spacingVerticalS) var(--spacingHorizontalL);
        color: var(--colorWashiLight);
        background: var(--colorAccentPurple);
        border: var(--strokeMedium) solid var(--colorInk);
        box-shadow: var(--spacingHorizontalL) var(--spacingVerticalSNudge) 0 var(--colorRust);
        clip-path: polygon(0 8%, 94% 0, 100% 74%, 92% 100%, 4% 92%);
        transform: rotate(-1.3deg) skewX(-3deg);
        max-width: min(34vw, 360px);
      }

      .brand h1 {
        grid-area: title;
        display: grid;
        grid-template-columns: auto auto;
        align-items: end;
        justify-content: start;
        column-gap: var(--spacingHorizontalS);
        margin: 0;
      }

      .brand-name {
        font-size: var(--fontSizeHero800);
        line-height: var(--lineHeightHero800);
        font-weight: var(--fontWeightBold);
        letter-spacing: var(--titleTracking);
        text-shadow:
          var(--spacingHorizontalXXS)
          var(--spacingVerticalXXS)
          0
          var(--colorInk);
      }

      .brand-english {
        margin-bottom: var(--spacingVerticalXS);
        padding: 0 var(--spacingHorizontalXS);
        color: var(--colorInk);
        background: var(--colorAccentLime);
        border: var(--strokeThin) solid var(--colorInk);
        font-size: var(--fontSizeBase200);
        line-height: var(--lineHeightBase200);
        font-weight: var(--fontWeightBold);
        font-style: italic;
        letter-spacing: var(--microTracking);
        white-space: nowrap;
        transform: rotate(2deg);
      }

      .brand p {
        grid-area: subtitle;
        margin: 0;
        color: var(--colorWashiLight);
        font-size: var(--fontSizeBase200);
        line-height: var(--lineHeightBase200);
        font-weight: var(--fontWeightSemibold);
        letter-spacing: var(--microTracking);
        text-wrap: balance;
      }

      .mode-tabs {
        grid-area: modes;
        display: grid;
        grid-template-columns: repeat(2, minmax(76px, 1fr));
        gap: var(--spacingHorizontalXXS);
        padding: var(--spacingVerticalXS);
        background: var(--colorWashiDeep);
        border: var(--strokeMedium) solid var(--colorInk);
        box-shadow: calc(0px - var(--spacingHorizontalXS)) var(--spacingVerticalXS) 0 var(--colorLakeDeep);
        clip-path: polygon(2% 0, 100% 8%, 96% 100%, 0 92%);
        transform: rotate(0.8deg) skewX(-2deg);
      }

      .mode-tab {
        min-height: var(--controlMinSize);
        padding: var(--spacingVerticalS) var(--spacingHorizontalL);
        color: var(--colorInkSoft);
        background: transparent;
        border: 0;
        border: var(--strokeThin) solid transparent;
        border-radius: var(--borderRadiusNone);
        cursor: pointer;
        font-weight: var(--fontWeightSemibold);
        letter-spacing: var(--labelTracking);
        transition:
          color var(--durationFast) var(--curveEasyEase),
          background var(--durationFast) var(--curveEasyEase);
      }

      .mode-tab:hover {
        color: var(--colorInk);
        background: var(--colorMoss);
        border-color: var(--colorInk);
      }

      .mode-tab[aria-selected="true"] {
        color: var(--colorWashiLight);
        background: var(--colorAccentPurple);
        border-color: var(--colorInk);
        font-weight: var(--fontWeightBold);
        text-decoration: none;
        box-shadow: inset 0 calc(0px - var(--spacingVerticalXS)) 0 var(--colorAccentPink);
      }

      .tools {
        display: grid;
        grid-template-columns: repeat(2, max-content);
        gap: var(--spacingHorizontalS);
      }

      .tool-button {
        min-height: var(--controlMinSize);
        display: grid;
        grid-template-columns: auto var(--spacingHorizontalM);
        align-items: center;
        gap: var(--spacingHorizontalS);
        padding: var(--controlPadBlock) var(--controlPadInline);
        color: var(--colorInk);
        background: var(--colorWashiDeep);
        border: var(--strokeMedium) solid var(--colorInk);
        border-radius: var(--borderRadiusNone);
        box-shadow: var(--spacingHorizontalXS) var(--spacingVerticalXS) 0 var(--colorAccentPurple);
        cursor: pointer;
        font-weight: var(--fontWeightSemibold);
        transition:
          transform var(--durationFast) var(--curveEasyEase),
          color var(--durationFast) var(--curveEasyEase),
          background var(--durationFast) var(--curveEasyEase);
      }

      .tool-button::after {
        content: "";
        width: var(--spacingHorizontalS);
        height: var(--spacingHorizontalS);
        background: transparent;
        border: var(--strokeThin) solid currentColor;
        transform: rotate(0);
        transition:
          transform var(--durationFast) var(--curveEasyEase),
          background var(--durationFast) var(--curveEasyEase);
      }

      .tool-button:hover {
        transform: translateY(var(--hoverOffset));
        color: var(--colorInk);
        background: var(--colorWashiDeep);
      }

      .tool-button:active {
        transform: scale(var(--pressScale));
      }

      .tool-button[aria-pressed="true"] {
        color: var(--colorWashiLight);
        background: var(--colorAccentPurple);
        border-color: var(--colorInk);
      }

      .tool-button[aria-pressed="true"]::after {
        background: currentColor;
        transform: rotate(45deg);
      }

      .stage {
        position: relative;
        align-self: center;
        justify-self: center;
        width: var(--stageSize);
        aspect-ratio: 1;
      }

      body[data-mode="release"] .stage {
        width: min(calc(100vw - var(--spacingHorizontalXXL)), 1280px);
        height: clamp(430px, 58vh, 720px);
        aspect-ratio: auto;
      }

      .mode-panel {
        width: 100%;
        height: 100%;
        display: grid;
        grid-template-rows: 1fr auto;
        place-items: center;
        gap: var(--spacingVerticalM);
      }

      #meritPanel {
        grid-template-rows: 1fr;
        gap: 0;
      }

      .mode-panel[hidden] {
        display: none;
      }

      .stage-action {
        position: relative;
        width: 100%;
        height: 100%;
        padding: 0;
        color: var(--colorInk);
        background: transparent;
        border: 0;
        border-radius: var(--borderRadiusNone);
        cursor: pointer;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
        transition: transform var(--durationFast) var(--curveEasyEase);
      }

      .stage-action::after {
        content: "";
        position: absolute;
        left: 50%;
        bottom: var(--spacingVerticalL);
        width: var(--spacingHorizontalL);
        height: var(--spacingVerticalL);
        opacity: 0;
        background: var(--colorAccentLime);
        border: var(--strokeThin) solid var(--colorAccentPurple);
        clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%);
        transform: translateX(-50%) scale(0.7);
        pointer-events: none;
      }

      button.stage-action:focus-visible {
        outline: none;
        box-shadow: none;
      }

      button.stage-action:focus-visible::after {
        opacity: 1;
        animation: stage-focus-beacon var(--rhythmPeriod) var(--curveEasyEase) infinite;
      }

      .stage-action:active {
        transform: scale(var(--pressScale));
      }

      .mode-copy {
        min-height: var(--lineHeightBase500);
        display: grid;
        place-items: center;
        gap: var(--spacingVerticalXS);
        text-align: center;
      }

      .mode-copy p {
        margin: 0;
        padding: var(--spacingVerticalXS) var(--spacingHorizontalM);
        color: var(--colorInk);
        background: var(--colorWashiLight);
        border: var(--strokeMedium) solid var(--colorInk);
        font-size: var(--fontSizeBase300);
        line-height: var(--lineHeightBase300);
        font-weight: var(--fontWeightSemibold);
        letter-spacing: var(--labelTracking);
        box-shadow: var(--spacingHorizontalXS) var(--spacingVerticalXS) 0 var(--colorAccentPink);
        clip-path: polygon(2% 0, 100% 7%, 96% 100%, 0 90%);
        transform: rotate(-0.5deg);
      }

      .mode-copy .mode-detail {
        color: var(--colorWashiLight);
        background: var(--colorAccentPurple);
        font-size: var(--fontSizeBase200);
        line-height: var(--lineHeightBase200);
        letter-spacing: var(--microTracking);
        box-shadow: calc(0px - var(--spacingHorizontalXS)) var(--spacingVerticalXS) 0 var(--colorLake);
        transform: rotate(0.8deg);
      }

      .stats {
        display: grid;
        grid-template-columns: auto minmax(360px, 1fr);
        grid-template-areas:
          "title tools"
          "title data";
        align-items: center;
        gap: var(--spacingVerticalS) var(--spacingHorizontalXL);
        padding: var(--spacingVerticalM);
        background: var(--colorWashiLight);
        border: var(--strokeMedium) solid var(--colorInk);
        box-shadow: var(--spacingHorizontalL) var(--spacingVerticalSNudge) 0 var(--colorAccentLime);
        clip-path: polygon(0 5%, 98% 0, 100% 88%, 2% 100%);
      }

      .stats-title {
        grid-area: title;
        position: relative;
        isolation: isolate;
        justify-self: start;
        margin: 0;
        padding: var(--spacingVerticalS) var(--spacingHorizontalXL);
        color: var(--colorWashiLight);
        background: var(--colorInk);
        border: var(--strokeMedium) solid var(--colorInk);
        box-shadow:
          var(--spacingHorizontalS) var(--spacingVerticalS) 0 var(--colorAccentPink),
          calc(0px - var(--spacingHorizontalXS)) calc(0px - var(--spacingVerticalXS)) 0 var(--colorLake);
        font-size: clamp(var(--fontSizeBase500), 2.8vw, var(--fontSizeHero800));
        line-height: 1.05;
        font-weight: var(--fontWeightBold);
        font-style: italic;
        letter-spacing: var(--labelTracking);
        white-space: nowrap;
        text-align: left;
        transform: rotate(-2deg) skewX(-5deg);
      }

      .stats-title::before {
        content: "";
        position: absolute;
        z-index: 1;
        top: calc(0px - var(--spacingVerticalMNudge));
        left: var(--spacingHorizontalM);
        width: 42%;
        height: var(--spacingVerticalM);
        background: var(--colorAccentLime);
        border: var(--strokeThin) solid var(--colorInk);
        transform: rotate(4deg) skewX(18deg);
      }

      .stats-title::after {
        content: "";
        position: absolute;
        right: var(--spacingHorizontalL);
        bottom: calc(0px - var(--spacingVerticalL));
        width: var(--spacingHorizontalXXXL);
        height: var(--spacingVerticalXL);
        background: var(--colorInk);
        clip-path: polygon(0 0, 100% 0, 18% 100%);
        transform: rotate(-7deg);
      }

      .stats-grid {
        grid-area: data;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: var(--spacingHorizontalXXL);
        width: 100%;
        margin: 0;
      }

      .stats > .tools {
        grid-area: tools;
        justify-self: end;
      }

      .stat {
        display: grid;
        grid-template-columns: auto auto;
        align-items: baseline;
        justify-content: end;
        gap: var(--spacingHorizontalS);
        padding: var(--spacingVerticalS) var(--spacingHorizontalM);
        border: var(--strokeThin) solid var(--colorInk);
        background: var(--colorAccentLime);
        transform: skewX(-3deg);
      }

      .stat:nth-child(2) {
        color: var(--colorInk);
        background: var(--colorLake);
      }

      .stat dt {
        color: var(--colorInk);
        font-size: var(--fontSizeBase200);
        line-height: var(--lineHeightBase200);
        font-weight: var(--fontWeightSemibold);
        letter-spacing: var(--microTracking);
      }

      .stat dd {
        margin: 0;
        color: var(--colorInk);
        font-size: var(--fontSizeBase500);
        line-height: var(--lineHeightBase500);
        font-weight: var(--fontWeightBold);
        font-variant-numeric: tabular-nums;
      }

      .stat-unit {
        margin-left: var(--spacingHorizontalXS);
        color: var(--colorInk);
        font-size: var(--fontSizeBase200);
        line-height: var(--lineHeightBase200);
      }

      .footer-note {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: var(--spacingHorizontalL);
        color: var(--colorInk);
        font-size: var(--fontSizeBase200);
        line-height: var(--lineHeightBase200);
      }

      .footer-note p {
        margin: 0;
      }

      .signature-line {
        font-weight: var(--fontWeightSemibold);
        letter-spacing: var(--microTracking);
        text-wrap: balance;
      }

      .system-note {
        color: var(--colorInk);
        font-weight: var(--fontWeightSemibold);
        text-align: right;
      }

      .idle-hint {
        position: fixed;
        z-index: 3;
        top: 57%;
        left: 50%;
        display: grid;
        place-items: center;
        width: var(--idleCueSize);
        aspect-ratio: 1;
        margin: 0;
        padding: 0;
        color: var(--colorInk);
        background: var(--colorPaperAlpha);
        border: var(--strokeThin) solid var(--colorAccentPurple);
        border-radius: var(--borderRadiusCircular);
        box-shadow: none;
        transform: translate(-50%, -50%);
        font-size: var(--fontSizeBase200);
        line-height: var(--lineHeightBase200);
        font-weight: var(--fontWeightBold);
        letter-spacing: var(--labelTracking);
        text-align: center;
        white-space: nowrap;
        pointer-events: none;
        animation: idle-hint-in var(--durationNormal) var(--curveDecelerateMax);
      }

      .idle-hint::before {
        content: "";
        position: absolute;
        z-index: -1;
        inset: calc(0px - var(--spacingHorizontalS));
        background: transparent;
        border: var(--strokeThin) solid var(--colorAccentPurple);
        border-radius: var(--borderRadiusCircular);
        animation: idle-cue-pulse var(--rhythmPeriod) var(--curveEasyEase) infinite;
      }

      body[data-mode="release"] .idle-hint {
        top: 66%;
        border-color: var(--colorAccentPink);
      }

      body[data-mode="release"] .idle-hint::before {
        border-color: var(--colorAccentPink);
      }

      .idle-hint[hidden] {
        display: none;
      }

      .fortune-overlay {
        position: fixed;
        z-index: 5;
        inset: 0;
        display: grid;
        place-items: center;
        padding:
          calc(var(--spacingVerticalXL) + env(safe-area-inset-top))
          calc(var(--spacingHorizontalXL) + env(safe-area-inset-right))
          calc(var(--spacingVerticalXL) + env(safe-area-inset-bottom))
          calc(var(--spacingHorizontalXL) + env(safe-area-inset-left));
        background: var(--colorModalBackdrop);
      }

      .fortune-overlay[hidden] {
        display: none;
      }

      .fortune-stage {
        position: relative;
        display: grid;
        justify-items: center;
        gap: var(--spacingVerticalL);
        width: min(100%, 380px);
        perspective: 900px;
        transform-style: preserve-3d;
      }

      .fortune-paper {
        position: relative;
        z-index: 2;
        display: grid;
        place-items: center;
        width: min(100%, 380px);
        transform-origin: 50% 16%;
        transform-style: preserve-3d;
        backface-visibility: hidden;
        animation: fortune-draw var(--durationFortuneMotion) var(--curveDecelerateMax);
      }

      .fortune-aura {
        position: absolute;
        z-index: 1;
        inset: -5% -18% 8%;
        pointer-events: none;
      }

      .fortune-aura span {
        position: absolute;
        display: grid;
        place-items: center;
        width: clamp(44px, 14vw, 72px);
        aspect-ratio: 1;
        font-size: clamp(34px, 11vw, 58px);
        line-height: 1;
        opacity: 0;
        filter: drop-shadow(var(--spacingHorizontalXS) var(--spacingVerticalXS) 0 var(--colorInk));
        animation: fortune-aura-pop
          calc(var(--durationFortuneMotion) + var(--durationSlow))
          var(--curveDecelerateMax)
          forwards;
      }

      .fortune-aura span:nth-child(1) { top: 0; left: 2%; }
      .fortune-aura span:nth-child(2) { top: 8%; right: -2%; animation-delay: 40ms; }
      .fortune-aura span:nth-child(3) { top: 30%; left: -7%; animation-delay: 80ms; }
      .fortune-aura span:nth-child(4) { top: 38%; right: -8%; animation-delay: 120ms; }
      .fortune-aura span:nth-child(5) { bottom: 30%; left: -4%; animation-delay: 160ms; }
      .fortune-aura span:nth-child(6) { right: -3%; bottom: 23%; animation-delay: 200ms; }
      .fortune-aura span:nth-child(7) { bottom: 3%; left: 10%; animation-delay: 240ms; }
      .fortune-aura span:nth-child(8) { right: 8%; bottom: 1%; animation-delay: 280ms; }

      .fortune-slip {
        position: relative;
        width: min(78vw, 320px);
        min-height: min(62svh, 540px);
        display: grid;
        grid-template-rows: auto 1fr auto;
        justify-items: center;
        align-items: center;
        gap: var(--spacingVerticalM);
        padding: var(--spacingVerticalXXL) var(--spacingHorizontalXXL);
        color: var(--colorInk);
        background-color: var(--colorWashi);
        background-image: radial-gradient(
          circle,
          var(--colorInkFaintAlpha) 0 1px,
          transparent 1.2px
        );
        background-size: var(--spacingHorizontalS) var(--spacingVerticalS);
        border: var(--strokeMedium) solid var(--colorInk);
        box-shadow:
          var(--spacingHorizontalL) var(--spacingVerticalL) 0 var(--colorAccentPink),
          calc(0px - var(--spacingHorizontalS)) calc(0px - var(--spacingVerticalS)) 0 var(--colorWashiDeep);
        clip-path: polygon(6% 0, 96% 2%, 100% 92%, 88% 100%, 4% 97%, 0 7%);
        transform: rotate(-1deg);
        transform-origin: 50% 16%;
        transform-style: preserve-3d;
        backface-visibility: hidden;
        overflow: hidden;
      }

      .fortune-paper,
      .fortune-slip,
      .fortune-continue,
      .fortune-signature {
        position: relative;
        z-index: 2;
      }

      .fortune-signature {
        width: min(92vw, 380px);
        margin: calc(0px - var(--spacingVerticalS)) 0 0;
        padding: var(--spacingVerticalXS) var(--spacingHorizontalM);
        color: var(--colorWashiLight);
        background: var(--colorInk);
        border: var(--strokeThin) solid var(--colorInk);
        box-shadow: var(--spacingHorizontalXS) var(--spacingVerticalXS) 0 var(--colorLake);
        clip-path: polygon(2% 0, 100% 8%, 97% 100%, 0 90%);
        font-size: var(--fontSizeBase100);
        line-height: var(--lineHeightBase100);
        font-weight: var(--fontWeightSemibold);
        letter-spacing: var(--microTracking);
        text-align: center;
        text-wrap: balance;
        transform: rotate(0.6deg);
      }

      .fortune-slip::before,
      .fortune-slip::after {
        content: "";
        position: absolute;
        z-index: 0;
        border: var(--strokeThin) solid var(--colorInk);
      }

      .fortune-slip > * {
        position: relative;
        z-index: 1;
      }

      .fortune-slip::before {
        top: var(--spacingVerticalL);
        right: calc(0px - var(--spacingHorizontalL));
        width: 42%;
        height: var(--spacingVerticalXXXL);
        background: var(--colorLake);
        box-shadow: var(--spacingHorizontalS) var(--spacingVerticalS) 0 var(--colorInk);
        transform: rotate(7deg);
      }

      .fortune-slip::after {
        bottom: var(--spacingVerticalXXL);
        left: calc(0px - var(--spacingHorizontalL));
        width: 48%;
        height: var(--spacingVerticalXXL);
        background: var(--colorAccentPink);
        box-shadow:
          calc(0px - var(--spacingHorizontalS))
          var(--spacingVerticalS)
          0
          var(--colorInk);
        transform: rotate(-6deg);
      }

      .fortune-kicker,
      .fortune-count,
      .fortune-keyword,
      .fortune-english,
      .fortune-explanation {
        margin: 0;
      }

      .fortune-kicker {
        justify-self: start;
        align-self: start;
        padding: 0;
        color: var(--colorInk);
        background: transparent;
        border: 0;
        font-size: var(--fontSizeBase200);
        line-height: var(--lineHeightBase200);
        font-weight: var(--fontWeightBold);
        letter-spacing: var(--labelTracking);
        transform: rotate(-1.5deg);
      }

      .fortune-title {
        display: grid;
        place-items: center;
        margin: 0;
        padding: var(--spacingVerticalM) var(--spacingHorizontalS);
        color: var(--colorWashiLight);
        background: var(--colorRustDeep);
        border: var(--strokeMedium) solid var(--colorInk);
        box-shadow: var(--spacingHorizontalS) var(--spacingVerticalS) 0 var(--colorLake);
        font-family: var(--fontFamilyInk);
        font-size: var(--fontSizeFortune);
        line-height: var(--lineHeightFortune);
        font-weight: var(--fontWeightSemibold);
        writing-mode: vertical-rl;
        text-orientation: upright;
        letter-spacing: var(--spacingVerticalS);
        transform: translateY(var(--fortuneTitleLift)) rotate(1deg);
      }

      .fortune-keyword {
        font-family: var(--fontFamilyInk);
        font-size: var(--fontSizeFortuneKeyword);
        line-height: var(--lineHeightFortune);
        font-weight: var(--fontWeightSemibold);
        letter-spacing: var(--spacingHorizontalXS);
      }

      .fortune-message {
        position: absolute;
        z-index: 4;
        top: 88%;
        left: 50%;
        width: min(88vw, 340px);
        display: grid;
        gap: var(--spacingVerticalXS);
        padding: var(--spacingVerticalM) var(--spacingHorizontalL);
        background: var(--colorWashiLight);
        border: var(--strokeMedium) solid var(--colorInk);
        box-shadow: var(--spacingHorizontalS) var(--spacingVerticalS) 0 var(--colorAccentPurple);
        transform: translate(-53%, -50%) rotate(1deg);
      }

      .fortune-message::before {
        content: "";
        position: absolute;
        top: calc(0px - var(--spacingVerticalMNudge));
        left: 38%;
        width: 34%;
        height: var(--spacingVerticalL);
        background: var(--colorAccentPink);
        border: var(--strokeThin) solid var(--colorInk);
        box-shadow: var(--spacingHorizontalXS) var(--spacingVerticalXS) 0 var(--colorInk);
        transform: rotate(-3deg);
      }

      .fortune-english {
        color: var(--colorRustDeep);
        font-size: var(--fontSizeBase300);
        line-height: var(--lineHeightBase300);
        font-weight: var(--fontWeightBold);
        letter-spacing: var(--labelTracking);
      }

      .fortune-explanation {
        color: var(--colorInkSoft);
        font-size: var(--fontSizeBase200);
        line-height: var(--lineHeightBase300);
        font-weight: var(--fontWeightSemibold);
        text-align: left;
        text-wrap: pretty;
      }

      .fortune-count {
        position: absolute;
        z-index: 3;
        top: var(--spacingVerticalL);
        right: 0;
        max-width: 122px;
        padding: var(--spacingVerticalXS) var(--spacingHorizontalS);
        background: var(--colorAccentLime);
        border: var(--strokeMedium) solid var(--colorInk);
        box-shadow: var(--spacingHorizontalS) var(--spacingVerticalS) 0 var(--colorInk);
        font-size: var(--fontSizeBase100);
        line-height: var(--lineHeightBase200);
        font-weight: var(--fontWeightBold);
        text-align: center;
        transform: rotate(5deg);
      }

      .fortune-continue {
        min-width: 168px;
        min-height: var(--controlMinSize);
        padding: var(--controlPadBlock) var(--spacingHorizontalXXL);
        color: var(--colorInk);
        background: var(--colorWashiDeep);
        border: var(--strokeMedium) solid var(--colorInk);
        box-shadow: var(--spacingHorizontalS) var(--spacingVerticalS) 0 var(--colorLake);
        font-weight: var(--fontWeightBold);
        cursor: pointer;
      }

      .fortune-continue:hover {
        background: var(--colorMoss);
        transform: translateY(var(--hoverOffset));
      }

      .fortune-continue:active {
        transform: scale(var(--pressScale));
      }

      .fortune-overlay[data-fortune-tone="inauspicious"] .fortune-continue {
        color: var(--colorWashiLight);
        background: var(--colorRustDeep);
        box-shadow: var(--spacingHorizontalS) var(--spacingVerticalS) 0 var(--colorAccentOrange);
      }

      .fortune-overlay[data-fortune-tone="inauspicious"] .fortune-title {
        color: var(--colorWashiLight);
        background: var(--colorFortuneDark);
        box-shadow: var(--spacingHorizontalS) var(--spacingVerticalS) 0 var(--colorAccentOrange);
      }

      .fortune-fire {
        position: absolute;
        z-index: 4;
        inset: -8% -22% 10%;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        grid-template-rows: repeat(3, 1fr);
        place-items: center;
        color: var(--colorAccentOrange);
        font-size: clamp(52px, 16vw, 88px);
        line-height: 1;
        opacity: 0;
        pointer-events: none;
        transform: translateY(18%) scale(0.38);
      }

      .fortune-fire span {
        opacity: 0;
        text-shadow:
          var(--spacingHorizontalS) var(--spacingVerticalS) 0 var(--colorInk),
          calc(0px - var(--spacingHorizontalXS)) calc(0px - var(--spacingVerticalXS)) 0 var(--colorWashiDeep);
      }

      .fortune-overlay[data-exit="keep"] .fortune-stage {
        animation: fortune-keep-exit var(--durationFortuneMotion) var(--curveAccelerateMax) forwards;
      }

      .fortune-overlay[data-exit="burn"] .fortune-stage {
        animation: fortune-burn-exit var(--durationFortuneBurn) var(--curveAccelerateMax) forwards;
      }

      .fortune-overlay[data-exit="burn"] .fortune-fire {
        animation: fortune-fire-burst var(--durationFortuneBurn) var(--curveDecelerateMax) forwards;
      }

      .fortune-overlay[data-exit="burn"] .fortune-fire span {
        opacity: 1;
        animation: fortune-flame-lick 150ms var(--curveEasyEase) infinite alternate;
      }

      .fortune-overlay[data-exit="burn"] .fortune-fire span:nth-child(3n + 2) {
        animation-delay: 70ms;
        animation-duration: 190ms;
      }

      .fortune-overlay[data-exit="burn"] .fortune-fire span:nth-child(3n) {
        animation-delay: 110ms;
        animation-duration: 220ms;
      }

      .fortune-overlay[data-exit="burn"] {
        animation: fortune-burn-backdrop var(--durationFortuneBurn) var(--curveEasyEase) forwards;
      }

      @keyframes fortune-draw {
        0% {
          opacity: 0;
          transform: translateY(12vh) rotateX(-82deg) rotateZ(5deg) scale(0.72);
        }
        48% {
          opacity: 1;
          transform: translateY(-2vh) rotateX(9deg) rotateZ(-2deg) scale(1.06);
        }
        64% {
          transform: translateX(calc(0px - var(--spacingHorizontalS))) rotateX(-3deg) rotateZ(1deg) scale(0.985);
        }
        78% {
          transform: translateX(var(--spacingHorizontalS)) rotateX(1deg) rotateZ(-2deg) scale(1.015);
        }
        100% {
          opacity: 1;
          transform: translate(0, 0) rotateX(0) rotateZ(0) scale(1);
        }
      }

      @keyframes fortune-keep-exit {
        0% {
          opacity: 1;
          transform: translateY(0) rotate(0) scale(1);
        }
        20% {
          transform: translateY(calc(0px - var(--spacingVerticalS))) rotate(-1deg) scale(1.02);
        }
        100% {
          opacity: 0;
          transform: translateY(115vh) rotate(9deg) scale(0.94);
        }
      }

      @keyframes fortune-burn-exit {
        0% {
          opacity: 1;
          filter: saturate(1) sepia(0);
          transform: translateY(0) rotate(0) scale(1);
        }
        24% {
          opacity: 1;
          filter: saturate(1.9) sepia(0.42) contrast(1.08);
          transform: translateY(var(--spacingVerticalS)) rotate(-3deg) scale(1.12);
        }
        58% {
          opacity: 0.78;
          filter: saturate(2.3) sepia(0.62) contrast(1.18);
          transform: translateY(calc(0px - var(--spacingVerticalM))) rotate(3deg) scale(1.34);
        }
        100% {
          opacity: 0;
          filter: saturate(2.7) sepia(0.84) contrast(1.35);
          transform: translateY(-7vh) rotate(-7deg) scale(2.12);
        }
      }

      @keyframes fortune-fire-burst {
        0% {
          opacity: 0;
          transform: translateY(22%) scale(0.38);
        }
        18% {
          opacity: 1;
          transform: translateY(8%) scale(0.82);
        }
        62% {
          opacity: 1;
          transform: translateY(-8%) scale(1.18);
        }
        100% {
          opacity: 0;
          transform: translateY(-42%) scale(1.72);
        }
      }

      @keyframes fortune-flame-lick {
        from {
          transform: translateY(var(--spacingVerticalXS)) rotate(-7deg) scale(0.92);
        }
        to {
          transform: translateY(calc(0px - var(--spacingVerticalM))) rotate(8deg) scale(1.16);
        }
      }

      @keyframes fortune-burn-backdrop {
        0% {
          background: var(--colorModalBackdrop);
        }
        18% {
          background: var(--colorAccentOrange);
        }
        46% {
          background: var(--colorRustDeep);
        }
        100% {
          background: var(--colorModalBackdrop);
        }
      }

      @keyframes fortune-aura-pop {
        0% {
          opacity: 0;
          transform: translateY(var(--spacingVerticalXXL)) rotate(-10deg) scale(0.25);
        }
        34% {
          opacity: 1;
          transform: translateY(calc(0px - var(--spacingVerticalS))) rotate(6deg) scale(1.16);
        }
        68% {
          opacity: 0.92;
          transform: translateY(calc(0px - var(--spacingVerticalXXL))) rotate(-3deg) scale(1);
        }
        100% {
          opacity: 0;
          transform: translateY(calc(0px - var(--spacingVerticalXXXL))) rotate(4deg) scale(0.86);
        }
      }

      @keyframes idle-hint-in {
        from {
          opacity: 0;
          transform: translate(-50%, -35%) scale(0.88);
        }
        to {
          opacity: 1;
          transform: translate(-50%, -50%) scale(1);
        }
      }

      @keyframes idle-cue-pulse {
        0%,
        100% {
          opacity: 0.38;
          transform: scale(0.58);
          box-shadow: 0 0 0 0 var(--colorInkFaintAlpha);
        }
        72% {
          opacity: 1;
          transform: scale(1);
          box-shadow: 0 0 0 var(--spacingHorizontalS) transparent;
        }
      }

      @keyframes stage-focus-beacon {
        0%,
        100% {
          opacity: 0.45;
          transform: translateX(-50%) scale(0.72) rotate(0);
        }
        72% {
          opacity: 1;
          transform: translateX(-50%) scale(1) rotate(45deg);
        }
      }

      body[data-hit="perfect"] .topbar,
      body[data-hit="perfect"] .stats,
      body[data-hit="perfect"] .footer-note {
        animation: perfect-ui-hit 240ms var(--curveDecelerateMax);
      }

      body[data-fever="true"] .topbar,
      body[data-fever="true"] .stats,
      body[data-fever="true"] .footer-note {
        animation: fever-ui-beat var(--rhythmPeriod) var(--curveEasyEase) infinite;
      }

      @keyframes perfect-ui-hit {
        0%,
        100% {
          transform: translateY(0) scale(1);
        }
        34% {
          transform: translateY(var(--spacingVerticalXS)) scale(1.025);
        }
        66% {
          transform: translateY(calc(0px - var(--spacingVerticalXXS))) scale(0.995);
        }
      }

      @keyframes fever-ui-beat {
        0% {
          transform: translateY(var(--spacingVerticalXS)) scale(1.018);
        }
        18%,
        100% {
          transform: translateY(0) scale(1);
        }
      }

      .hc-label {
        display: none;
      }

      .visually-hidden {
        position: absolute !important;
        width: 1px !important;
        height: 1px !important;
        padding: 0 !important;
        margin: -1px !important;
        overflow: hidden !important;
        clip: rect(0, 0, 0, 0) !important;
        white-space: nowrap !important;
        border: 0 !important;
      }

      @media (max-width: 900px) {
        :root {
          --stageSize: clamp(290px, 67vmin, 510px);
          --safePadRight: calc(var(--spacingHorizontalL) + env(safe-area-inset-right));
          --safePadLeft: calc(var(--spacingHorizontalL) + env(safe-area-inset-left));
        }

        body {
          overflow: auto;
        }

        .screen {
          grid-template-rows: auto minmax(0, 1fr) auto auto;
          gap: var(--spacingVerticalS);
        }

        .topbar {
          grid-template-columns: minmax(0, 1fr) minmax(160px, 190px);
          grid-template-areas: "brand modes";
          gap: var(--spacingVerticalM) var(--spacingHorizontalM);
        }

        .mode-tabs {
          width: 100%;
          justify-self: end;
        }

        .brand {
          max-width: min(46vw, 180px);
          padding-inline: var(--spacingHorizontalS);
        }

        body[data-mode="release"] .stage {
          width: calc(100vw - var(--spacingHorizontalS));
          height: clamp(400px, 54svh, 620px);
        }

        .stats {
          grid-template-columns: minmax(0, auto) minmax(0, 1fr);
          grid-template-areas:
            "title tools"
            "data data";
          gap: var(--spacingVerticalS) var(--spacingHorizontalM);
        }

        .stats-title {
          justify-self: start;
          text-align: left;
        }

        .stats > .tools {
          justify-self: end;
        }

        .stat {
          grid-template-columns: 1fr;
          justify-items: center;
          gap: var(--spacingVerticalXS);
          text-align: center;
        }

        .footer-note {
          grid-template-columns: 1fr;
          gap: var(--spacingVerticalXS);
          text-align: center;
        }

        .system-note {
          text-align: center;
        }
      }

      @media (max-width: 560px) {
        :root {
          --stageSize: clamp(265px, 80vw, 360px);
          --safePadTop: calc(var(--spacingVerticalM) + env(safe-area-inset-top));
          --safePadRight: calc(var(--spacingHorizontalL) + env(safe-area-inset-right));
          --safePadBottom: calc(var(--spacingVerticalM) + env(safe-area-inset-bottom));
          --safePadLeft: calc(var(--spacingHorizontalL) + env(safe-area-inset-left));
        }

        .screen {
          gap: var(--spacingVerticalS);
        }

        .brand-name {
          font-size: var(--fontSizeHero700);
          line-height: var(--lineHeightHero700);
        }

        .brand-english {
          margin-bottom: var(--spacingVerticalXXS);
          font-size: var(--fontSizeBase100);
          line-height: var(--lineHeightBase100);
        }

        .brand p {
          font-size: var(--fontSizeBase100);
          line-height: var(--lineHeightBase100);
        }

        .stats > .tools {
          width: 100%;
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: var(--spacingHorizontalXS);
        }

        .tool-button {
          min-width: 0;
          grid-template-columns: minmax(0, auto) var(--spacingHorizontalS);
          gap: var(--spacingHorizontalXS);
          padding-inline: var(--spacingHorizontalS);
          font-size: var(--fontSizeBase200);
          line-height: var(--lineHeightBase200);
        }

        .stats {
          padding: var(--spacingVerticalS);
        }

        body[data-mode="release"] .stage {
          width: 100vw;
          height: clamp(410px, 56svh, 540px);
          margin-inline: calc(0px - var(--safePadLeft)) calc(0px - var(--safePadRight));
        }

        .stats-grid {
          gap: var(--spacingHorizontalM);
        }

        .stat {
          padding: var(--spacingVerticalS) var(--spacingHorizontalS);
        }

        .stat dt {
          font-size: var(--fontSizeBase100);
          line-height: var(--lineHeightBase100);
        }

        .stat dd {
          font-size: var(--fontSizeBase400);
          line-height: var(--lineHeightBase400);
        }

        .footer-note {
          font-size: var(--fontSizeBase100);
          line-height: var(--lineHeightBase100);
        }
      }

      @media (min-width: 390px) and (max-width: 460px) and (min-height: 830px) {
        .topbar {
          grid-template-columns: minmax(0, 1fr) minmax(190px, 224px);
          grid-template-areas: "brand modes";
          gap: var(--spacingVerticalS) var(--spacingHorizontalS);
        }

        .brand {
          max-width: min(43vw, 168px);
        }

        .mode-tabs {
          width: 100%;
          justify-self: end;
        }

        .tool-button {
          padding-inline: var(--spacingHorizontalS);
          font-size: var(--fontSizeBase200);
          line-height: var(--lineHeightBase200);
        }
      }

      @media (min-width: 390px) and (max-width: 420px) and (min-height: 830px) {
        :root {
          --stageSize: min(82vw, 330px);
        }

        body[data-mode="release"] .stage {
          height: clamp(440px, 54svh, 470px);
        }
      }

      @media (min-width: 421px) and (max-width: 460px) and (min-height: 900px) {
        :root {
          --stageSize: min(82vw, 360px);
        }

        body[data-mode="release"] .stage {
          height: clamp(480px, 54svh, 510px);
        }

          fortuneClosing = false;
          fortuneTimer = 0;
          stopAuto(false);
          window.clearTimeout(idleHintTimer);
          idleHint.hidden = true;
          focusBeforeFortune = activeAction();

          const level = FORTUNE_LEVELS.includes(forcedLevel)
            ? forcedLevel
            : FORTUNE_LEVELS[randomIndex(FORTUNE_LEVELS.length)];
          const message = FORTUNE_MESSAGES.find(
            (item) => item.keyword === forcedKeyword
          ) || FORTUNE_MESSAGES[randomIndex(FORTUNE_MESSAGES.length)];
          const isMerit = mode === "merit";
          fortuneTone = AUSPICIOUS_FORTUNES.has(level) ? "auspicious" : "inauspicious";
          fortuneMode.textContent = "今日赛博签";
          fortuneTitle.textContent = level;
          fortuneKeyword.textContent = message.keyword;
          fortuneEnglish.textContent = message.english;
          fortuneExplanation.textContent = message.description;
          fortuneDescription.textContent = isMerit
            ? `本次积攒 ${sessionActionCount} 次`
            : `本次放生 ${sessionActionCount} 尾`;
          const auraIcons = fortuneTone === "auspicious" ? ["👍", "🌹"] : ["❓", "😱"];
          fortuneAuraItems.forEach((item, index) => {
            item.textContent = auraIcons[index % auraIcons.length];
          });
          fortuneContinue.textContent = fortuneTone === "auspicious"
            ? "🫴 收好 继续积攒"
            : "🔥 立刻化解";
          fortuneContinue.removeAttribute("aria-disabled");

          document.body.dataset.fortune = "true";
          fortuneOverlay.dataset.fortuneTone = fortuneTone;
          fortuneOverlay.removeAttribute("data-exit");
          window.clearTimeout(announcementTimer);
          liveStatus.textContent = "";
          fortuneOverlay.hidden = false;
          fortuneContinue.focus();
          screen.inert = true;
          screen.setAttribute("aria-hidden", "true");
        }

        function closeFortuneSummary() {
          if (!fortuneOpen || fortuneClosing) return;
          fortuneClosing = true;
          fortuneOverlay.dataset.exit = fortuneTone === "auspicious" ? "keep" : "burn";
          fortuneContinue.setAttribute("aria-disabled", "true");
          window.clearTimeout(fortuneTimer);
          fortuneTimer = window.setTimeout(
            finishFortuneSummary,
            reducedMotion
              ? 20
              : fortuneTone === "auspicious"
                ? FORTUNE_EXIT_DURATION
                : FORTUNE_BURN_DURATION
          );
        }

        function finishFortuneSummary() {
          if (!fortuneOpen) return;
          const completedTone = fortuneTone;
          screen.inert = false;
          screen.removeAttribute("aria-hidden");
          fortuneOverlay.hidden = true;
          fortuneOverlay.removeAttribute("data-exit");
          fortuneOverlay.removeAttribute("data-fortune-tone");
          fortuneContinue.removeAttribute("aria-disabled");
          document.body.removeAttribute("data-fortune");
          fortuneOpen = false;
          fortuneClosing = false;
          comboCount = 0;
          perfectStreak = 0;
          lastTimingGrade = "READY";
          feverStarted = 0;
          feverUntil = 0;
          feverWasActive = false;
          document.body.removeAttribute("data-fever");
          rhythmBeatIndex = 0;
          rhythmEpoch = performance.now();
          resetSessionCycle();
          resetIdleHint();
          renderUi();
          const focusTarget = focusBeforeFortune?.isConnected
            ? focusBeforeFortune
            : activeAction();
          focusBeforeFortune = null;
          focusTarget.focus();
          const nextAction = mode === "merit" ? "积攒" : "放生";
          announce(
            completedTone === "auspicious"
              ? `签文已收好，可以继续${nextAction}`
              : `凶签已化解，可以继续${nextAction}`
          );

        function showIdleHint() {
          if (autoActive || fortuneOpen || fortunePending || document.hidden) {
            return;
          }
          const hint = mode === "merit"
            ? {
                visual: "轻敲",
                announcement: "跟随收拢节拍敲击木鱼"
              }
            : {
                visual: "轻放",
                announcement: "跟随浪线抵达入水点放生"
              };
          idleHint.textContent = hint.visual;
          idleHint.hidden = false;
          announce(`提示：${hint.announcement}`);
        }

        function resetIdleHint() {
          window.clearTimeout(idleHintTimer);
          idleHint.hidden = true;
          if (!autoActive && !fortuneOpen && !fortunePending && !document.hidden) {
            idleHintTimer = window.setTimeout(showIdleHint, IDLE_HINT_DELAY);
          }
        }

        async function resolveLocation() {
          try {
            const endpoint = document.documentElement.dataset.locationEndpoint?.trim();
            let label = "";
            if (endpoint) {
              const endpointUrl = new URL(endpoint, window.location.origin);
              if (endpointUrl.origin !== window.location.origin) {
                throw new Error("Location endpoint must be same-origin");
              }
              const response = await window.fetch(endpointUrl, {
                cache: "no-store",
                credentials: "same-origin",
                headers: { Accept: "application/json" }
              });
              if (!response.ok) throw new Error(`Location request failed: ${response.status}`);
              const payload = await response.json();
              label = [payload.city, payload.region, payload.country]
                .find((value) => typeof value === "string" && value.trim()) || "";
            } else {
              const timeZone = Intl.DateTimeFormat().resolvedOptions().timeZone || "";
              const knownZones = {
                "Asia/Shanghai": "上海",
                "Asia/Hong_Kong": "香港",
                "Asia/Singapore": "新加坡",
                "Asia/Tokyo": "东京",
                "America/Los_Angeles": "洛杉矶",
                "America/New_York": "纽约",
                "Europe/London": "伦敦"
              };
              label = knownZones[timeZone]
                || timeZone.split("/").pop()?.replaceAll("_", " ")
                || "";
            }
            if (!label) throw new Error("Location response did not include a place name");
            locationName.textContent = label.trim();
            document.title = `佛了 for luck · ${label.trim()}`;
            announce(`当前所在地：${label.trim()}`);
          } catch (error) {
            locationName.textContent = "此地";
            document.title = "佛了 for luck · 此地";
            setSystemMessage(STRINGS.locationUnavailable);
            announce(STRINGS.locationUnavailable);
          }
        }

        function reportStorageFailure() {
          if (!storageAvailable) return;
          storageAvailable = false;
          storageNote.textContent = STRINGS.storageUnavailable;
          setSystemMessage(STRINGS.storageUnavailable);
        }

        function loadState() {
          try {
            const raw = window.localStorage.getItem(STORAGE_KEY);
            if (raw) {
              const saved = JSON.parse(raw);
              meritTotal = Number.isFinite(saved.merit) ? Math.max(0, saved.merit) : 0;
              releaseTotal = Number.isFinite(saved.release) ? Math.max(0, saved.release) : 0;
              soundEnabled = saved.sound !== false;
              return;
            }

            const legacyRaw = window.localStorage.getItem(LEGACY_STORAGE_KEY);
            if (legacyRaw) {
              const legacy = JSON.parse(legacyRaw);
              meritTotal = Number.isFinite(legacy.total) ? Math.max(0, legacy.total) : 0;
              soundEnabled = legacy.sound !== false;
            }
          } catch (error) {
            reportStorageFailure();
          }
        }

        function saveState() {
          if (!storageAvailable) return;
          try {
            window.localStorage.setItem(
              STORAGE_KEY,
              JSON.stringify({
                merit: meritTotal,
                release: releaseTotal,
                sound: soundEnabled
              })
            );
          } catch (error) {
            reportStorageFailure();
          }
        }

        function getPersonalTotal() {
          return mode === "merit" ? meritTotal : releaseTotal;
        }

        function getDemoGlobal() {
          const remote = mode === "merit" ? demoRemoteMerit : demoRemoteRelease;
          return MODES[mode].globalBase + getPersonalTotal() + remote;

        function makeNoiseBuffer(audio) {
          const duration = 0.09;
          const frameCount = Math.max(1, Math.floor(audio.sampleRate * duration));
          const buffer = audio.createBuffer(1, frameCount, audio.sampleRate);
          const channel = buffer.getChannelData(0);
          for (let index = 0; index < frameCount; index += 1) {
            const envelope = 1 - index / frameCount;
            channel[index] = (Math.random() * 2 - 1) * envelope;
          }
          return buffer;
        }

        async function ensureAudio() {
          if (!soundEnabled) return null;
          const AudioEngine = window.AudioContext || window.webkitAudioContext;
          if (!AudioEngine) {
            setSystemMessage(STRINGS.audioUnavailable);
            return null;
          }
          if (!audioContext) {
            audioContext = new AudioEngine();
            noiseBuffer = makeNoiseBuffer(audioContext);
          }
          if (audioContext.state === "suspended") {
            try {
              await audioContext.resume();
            } catch (error) {
              setSystemMessage(STRINGS.audioBlocked);
              return null;
            }
          }
          return audioContext;
        }

        async function playWoodSound(isPerfect = false) {
          const audio = await ensureAudio();
          if (!audio || !soundEnabled) return;
          const now = audio.currentTime;
          const output = audio.createGain();
          output.gain.setValueAtTime(0.0001, now);
          output.gain.exponentialRampToValueAtTime(isPerfect ? 0.46 : 0.38, now + 0.004);
          output.gain.exponentialRampToValueAtTime(0.0001, now + (isPerfect ? 0.34 : 0.27));
          output.connect(audio.destination);

          const tone = audio.createOscillator();
          const filter = audio.createBiquadFilter();
          tone.type = "triangle";
          tone.frequency.setValueAtTime((isPerfect ? 560 : 470) + Math.random() * 18, now);
          tone.frequency.exponentialRampToValueAtTime(isPerfect ? 360 : 310, now + 0.2);
          filter.type = "bandpass";
          filter.frequency.value = isPerfect ? 920 : 760;
          filter.Q.value = isPerfect ? 2.8 : 2.3;
          tone.connect(filter);
          filter.connect(output);
          tone.start(now);
          tone.stop(now + (isPerfect ? 0.35 : 0.28));

          const noise = audio.createBufferSource();
          const noiseFilter = audio.createBiquadFilter();
          const noiseGain = audio.createGain();
          noise.buffer = noiseBuffer;
          noiseFilter.type = "bandpass";
          noiseFilter.frequency.value = 1320;
          noiseFilter.Q.value = 1.7;
          noiseGain.gain.setValueAtTime(isPerfect ? 0.22 : 0.16, now);
          noiseGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.075);
          noise.connect(noiseFilter);
          noiseFilter.connect(noiseGain);
          noiseGain.connect(output);
          noise.start(now);
          noise.stop(now + 0.085);

          if (isPerfect) {
            const overtone = audio.createOscillator();
            const overtoneGain = audio.createGain();
            overtone.type = "sine";
            overtone.frequency.setValueAtTime(880, now + 0.008);
            overtone.frequency.exponentialRampToValueAtTime(640, now + 0.22);
            overtoneGain.gain.setValueAtTime(0.0001, now);
            overtoneGain.gain.exponentialRampToValueAtTime(0.12, now + 0.018);
            overtoneGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.26);
            overtone.connect(overtoneGain);
            overtoneGain.connect(audio.destination);
            overtone.start(now + 0.008);
            overtone.stop(now + 0.28);
          }
        }

        async function playWaterSound() {
          const audio = await ensureAudio();
          if (!audio || !soundEnabled) return;
          const now = audio.currentTime;

          const noise = audio.createBufferSource();
          const filter = audio.createBiquadFilter();
          const gain = audio.createGain();
          noise.buffer = noiseBuffer;
          filter.type = "lowpass";
          filter.frequency.setValueAtTime(1800, now);
          filter.frequency.exponentialRampToValueAtTime(540, now + 0.28);
          gain.gain.setValueAtTime(0.18, now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.32);
          noise.connect(filter);
          filter.connect(gain);
          gain.connect(audio.destination);
          noise.start(now);
          noise.stop(now + 0.34);

          const bubble = audio.createOscillator();
          const bubbleGain = audio.createGain();
          bubble.type = "sine";
          bubble.frequency.setValueAtTime(320, now + 0.03);
          bubble.frequency.exponentialRampToValueAtTime(710, now + 0.16);
          bubbleGain.gain.setValueAtTime(0.0001, now);
          bubbleGain.gain.exponentialRampToValueAtTime(0.12, now + 0.035);
          bubbleGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.2);
          bubble.connect(bubbleGain);
          bubbleGain.connect(audio.destination);
          bubble.start(now);
          bubble.stop(now + 0.22);
        }

        function activeAction() {
          return mode === "merit" ? meritAction : releaseAction;
        }

        function getRhythmPhase(time = performance.now()) {
          const period = MODES[mode].autoDelay;
          return ((((time - rhythmEpoch) % period) + period) % period) / period;
        }

        function getTimingGrade(time = performance.now(), fromAuto = false) {
          if (fromAuto) return { label: "PERFECT", rank: "perfect" };
          const phase = getRhythmPhase(time);
          const distance = Math.min(phase, 1 - phase);
          if (distance <= 0.075) return { label: "PERFECT", rank: "perfect" };
          if (distance <= 0.18) return { label: "COOL", rank: "cool" };
          return { label: "GOOD", rank: "good" };
        }

        function stageGeometry() {
          const bounds = activeAction().getBoundingClientRect();
          return {
            x: bounds.left + bounds.width / 2,
            y: bounds.top + bounds.height / 2,
            width: bounds.width,
            height: bounds.height,
            size: Math.min(bounds.width, bounds.height)
          };
        }

        function addRipple(x, y, start, end, color, life = 1050, scaleY = 1) {
          ripples.push({ born: performance.now(), x, y, start, end, color, life, scaleY });
          ripples = ripples.slice(-18);
        }

        function isFeverActive(time = performance.now()) {
          return time < feverUntil;
        }

        function triggerFever(time = performance.now()) {
          feverStarted = time;
          feverUntil = time + PERFECT_FEVER_DURATION;
          feverWasActive = true;
          document.body.dataset.fever = "true";
        }

        function updateCombo(timing) {
          if (timing.rank === "perfect") {
            comboCount += 1;
            perfectStreak += 1;
          } else if (timing.rank === "cool") {
            comboCount += 1;
            perfectStreak = 0;
          } else {
            comboCount = 0;
            perfectStreak = 0;
          }
          const shouldTriggerFever = perfectStreak > 0
            && perfectStreak % PERFECT_FEVER_THRESHOLD === 0
            && !isFeverActive();
          if (shouldTriggerFever) triggerFever();
          return shouldTriggerFever;
        }

        function feedbackSlot(geometry, type) {
          const sideOffset = Math.min(canvasWidth * 0.34, geometry.width * 0.72);
          const verticalOffset = Math.min(canvasHeight * 0.23, geometry.height * 0.48);
          const slots = type === "release"
            ? [
                { x: geometry.x - sideOffset * 0.72, y: geometry.y - verticalOffset * 0.9 },
                { x: geometry.x + sideOffset * 0.72, y: geometry.y - verticalOffset * 0.82 },
                { x: geometry.x, y: geometry.y - verticalOffset * 1.28 },
                { x: geometry.x - sideOffset * 0.86, y: geometry.y - verticalOffset * 0.28 },
                { x: geometry.x + sideOffset * 0.86, y: geometry.y - verticalOffset * 0.22 }
              ]
            : [
                { x: geometry.x - sideOffset, y: geometry.y - verticalOffset },
                { x: geometry.x + sideOffset, y: geometry.y - verticalOffset * 0.78 },
                { x: geometry.x - sideOffset * 0.92, y: geometry.y + verticalOffset * 0.62 },
                { x: geometry.x + sideOffset * 0.88, y: geometry.y + verticalOffset * 0.7 },
                { x: geometry.x, y: geometry.y - verticalOffset * 1.24 },
                { x: geometry.x + sideOffset * 0.18, y: geometry.y + verticalOffset * 1.02 }
              ];
          const slot = slots[Math.floor(Math.random() * slots.length)];
          const horizontalInset = Math.min(canvasWidth * 0.5, Math.max(112, canvasWidth * 0.13));
          return {
            x: Math.max(horizontalInset, Math.min(canvasWidth - horizontalInset, slot.x)),
            y: Math.max(120, Math.min(canvasHeight - 108, slot.y))
          };
        }

        function addBurst(timing, gain, detail, geometry, type) {
          const slot = feedbackSlot(geometry, type);
          bursts.push({
            born: performance.now(),
            grade: timing.label,
            rank: timing.rank,
            gain,
            detail,
            combo: comboCount > 1 ? `COMBO ×${comboCount}` : "",
            x: slot.x,
            y: slot.y,
            type,
            rotation: (Math.random() - 0.5) * 0.14,
            seed: Math.random()
          });
          bursts = bursts.slice(-10);
        }

        function strikeMerit(fromAuto = false) {
          if (fortuneOpen || fortunePending) return;
          const actionTime = performance.now();
          const timing = getTimingGrade(actionTime, fromAuto);
          registerSessionAction(actionTime);
          resetIdleHint();
          triggerUiHit(timing);
          const feverTriggered = updateCombo(timing);
          lastTimingGrade = timing.label;
          meritTotal += 1;
          woodStrikeStarted = actionTime;
          woodStrikeFromAuto = fromAuto;
          const geometry = stageGeometry();
          strikeEmojiParticles = makeStrikeEmojiParticles(fromAuto);
          strikeEmojiAnchor = {
            x: geometry.x + geometry.size * 0.17,
            y: geometry.y + geometry.size * 0.13,
            strikeStarted: woodStrikeStarted
          };
          const imprintAngle = Math.random() * Math.PI * 2;
          const imprintRadiusX = geometry.size * (0.42 + Math.random() * 0.28);
          const imprintRadiusY = geometry.size * (0.26 + Math.random() * 0.2);
          meritImprints.push({
            born: performance.now(),
            x: geometry.x + Math.cos(imprintAngle) * imprintRadiusX,
            y: geometry.y + Math.sin(imprintAngle) * imprintRadiusY,
            rotation: (Math.random() - 0.5) * 0.24,
            scale: 1.12 + Math.random() * 0.58
          });
          meritImprints = meritImprints.slice(-10);
          addRipple(

            geometry.y + geometry.size * 0.1,

          addBurst(timing, "功德 +1", "", geometry, "merit");
          renderUi();

          playWoodSound(timing.rank === "perfect");
          announce(
            feverTriggered
              ? "连续二十次 PERFECT，功德时刻开始，持续八秒"
              : STRINGS.meritStatus(timing.label, formatter.format(meritTotal), comboCount)
          );
          if (!fromAuto && navigator.vibrate) {
            navigator.vibrate(timing.rank === "perfect" ? [12, 18, 18] : 8);
          }
        }

        function releaseFish(fromAuto = false) {
          if (fortuneOpen || fortunePending) return;
          const actionTime = performance.now();
          const geometry = stageGeometry();
          const item = species[Math.floor(Math.random() * species.length)];
          const fish = createReleasedFish(item);
          const timing = getTimingGrade(actionTime, fromAuto);
          registerSessionAction(actionTime);

          triggerUiHit(timing);
          const feverTriggered = updateCombo(timing);
          lastTimingGrade = timing.label;
          fishSchool.push(fish);
          fishSchool = fishSchool.slice(-42);
          releaseTotal += 1;
          releaseDetail.textContent = `${timing.label} · 刚刚放生：${item.name}`;

          );
          addRipple(
